/* Layout: one calm reading column; each chapter = summary, steps to tick, worksheet cards to fill in; progress pinned at top */
:root{

}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55;min-height:100vh}
#root{max-width:860px;margin:0 auto;padding-inline:20px;padding-block:8px 80px}
h1{font-family:var(--display);font-weight:600;font-size:2rem;line-height:1.15;margin:0 0 .4rem;text-wrap:balance}
.lede{color:var(--muted);margin:0 0 1rem;max-width:62ch}

.bar span{display:block;height:100%;background:var(--accent);transition:width .3s}

section.phase{margin-top:40px;scroll-margin-top:60px}
.phase-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;border-bottom:1px solid var(--line);padding-bottom:6px}
.when{font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}

.note{font-size:.9rem;color:var(--muted);margin:4px 0 0;max-width:64ch}
.sum{margin-top:12px;background:var(--accent-soft);border-radius:10px;padding:12px 16px}

.sum p,.sum li{max-width:64ch;font-size:.95rem}
.sum p{margin:10px 0 0}
.sum ul{margin:8px 0 0;padding-left:20px}
.sum li{margin-top:4px}

input[type=checkbox]{width:20px;height:20px;margin:2px 0 0;flex:none;accent-color:var(--accent);cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.txt{min-width:0}
.txt small{display:block;color:var(--muted);font-size:.85rem}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-top:12px;display:flex;flex-direction:column;gap:12px}
.card-label{font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.types{display:flex;flex-direction:column;gap:10px}
.type{border-top:1px solid var(--line);padding-top:10px}
.type:first-child{border-top:0;padding-top:0}
.type>label,.chk{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.type b{font-weight:600}
.chks{display:flex;flex-direction:column;gap:8px}
textarea,input[type=text],input[type=number],select{font:inherit;font-size:.95rem;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;box-sizing:border-box;min-width:0}
textarea{min-height:64px;resize:vertical;line-height:1.45}
.type textarea{margin-top:8px;min-height:76px}
.rows{display:flex;flex-direction:column;gap:10px}

.rowc .rt{grid-column:1/-1;font-weight:600;font-size:.95rem}
.rowc .rt small{display:block;font-weight:400;color:var(--muted);font-size:.82rem}
.rowc.fixed{padding-right:12px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font-size:.78rem;color:var(--muted);font-weight:600}
.fld.wide{grid-column:1/-1}
.fld textarea,.fld input,.fld select{background:var(--surface)}

.del:hover{background:var(--accent-soft)}
.btn{align-self:flex-start;font:inherit;font-size:.9rem;font-weight:600;color:var(--accent);background:var(--accent-soft);border:0;border-radius:6px;padding:8px 14px;cursor:pointer}
.empty{font-size:.9rem;color:var(--muted);margin:0}
.qs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}

.q label{display:flex;gap:10px;flex:1;min-width:0;cursor:pointer}
.qn{color:var(--muted);font-variant-numeric:tabular-nums;min-width:1.4em;text-align:right}
.qt{min-width:0}
.q select{width:auto;min-width:60px;flex:none;padding:6px}
.q.wide select{min-width:150px}
.fb{font-size:.82rem;font-weight:600;min-width:5.5em}

.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:6px;text-align:center;vertical-align:middle}
th{font-size:.78rem;font-weight:600;color:var(--muted)}
td:first-child,th:first-child{text-align:left}
.ci td{font-weight:600}
.ih td{border-top:1px solid var(--line)}
.ih input{width:60px;padding:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}

.chip.hot{background:var(--warn-soft);color:var(--warn)}
.tag{display:inline-block;font-size:.72rem;font-weight:600;padding:1px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);margin-left:6px;vertical-align:2px;font-family:var(--body)}
.tag.rec{background:var(--warn-soft);color:var(--warn)}

.callout.ok{border-color:var(--accent);background:var(--accent-soft)}
.traps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}

.ladder{margin:0;padding-left:22px;font-size:.92rem}
.result{font-size:.95rem}
.result b{font-variant-numeric:tabular-nums}
.addon-intro{margin-top:40px;padding:14px 16px;border:1px dashed var(--line);border-radius:10px}
footer{margin-top:48px;font-size:.85rem;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
@media (prefers-reduced-motion:reduce){.bar span{transition:none}html{scroll-behavior:auto}}

header.hdr{background:linear-gradient(180deg,var(--midnight) 0%,var(--blue) 100%);color:#fff;padding:40px 20px 30px}
.hdr-in{max-width:860px;margin:0 auto}
.eyebrow{font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--sky);margin-bottom:10px}
.hdr-row{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}
.hdr h1{font-family:var(--body);font-size:clamp(28px,5vw,44px);line-height:1.05;font-weight:800;margin:0;letter-spacing:-.01em;color:#fff}
.hdr-sub{max-width:58ch;font-size:15px;color:#BBD0E8;margin:12px 0 0;line-height:1.5}
.hdr-count{font-family:var(--display);font-weight:600;font-size:clamp(36px,6vw,56px);line-height:1;color:var(--lime);text-align:right;font-variant-numeric:tabular-nums}
.hdr-count small{display:block;font-family:var(--body);font-size:14px;color:#BBD0E8;font-weight:400;margin-top:4px}
.track{margin-top:22px;height:10px;background:rgba(255,255,255,.15);border-radius:999px;overflow:hidden}
.track span{display:block;height:100%;width:0;background:var(--lime);border-radius:999px;transition:width .4s}
.topbar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:10px 20px}
.topbar-in{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.topbar a{font-size:14px;font-weight:500;color:#264468}
.topbar .sp{flex:1}
.topbar .status{font-size:13px;color:var(--muted)}
section.phase{scroll-margin-top:64px}
nav.jump{margin-top:20px}
h1,h2,h3{color:var(--blue)}
@media (prefers-reduced-motion:reduce){.track span{transition:none}}
</style>

  "The book includes three short questionnaires you can repeat to see whether things are changing. Take them now, again partway through your exposure work (around Week 8), and again when you finish. Each one saves with its date so you can compare.",
  "<b>Anxiety check</b> (based on the DASS-21 anxiety scale, Appendix III): 7 statements about the past week, rated 0–3. The page doubles the total, as the standard scoring does, giving a score out of 42 and a level from Normal to Extremely severe.",
  "<b>Avoidance check</b> (based on the AAQ-II, Appendix V): 7 statements rated 1–7. Higher means you push away or avoid hard feelings more. This should drop as your exposures go on.",
  "<b>Coping Inventory</b> (Appendix I): the book suggests retaking the Week 1 inventory several times. Change your answers in Week 1, then save a snapshot here to track your four scores over time."],steps:[
  ["chk1","Take the anxiety and avoidance checks at the start",""],
  ["chk2","Retake all three around the middle of your exposure work",""],
  ["chk3","Retake all three at the end",""]]},
 {id:"w1",nav:"Week 1",when:"Week 1",title:"Ch. 2 · The Alarm Response",page:"p. 5",ws:wk1,sum:[
  "Anxiety is your body's alarm going off when there's no real danger. When something feels threatening, your mind quickly asks three questions: <b>Is this a big danger?</b> <b>Could something terrible happen?</b> <b>Can I handle it?</b> If the answers are yes, yes and no, the alarm keeps ringing.",
  "Your body then gears up to fight or run: a racing heart, faster breathing, tense muscles, shakiness. You feel an urge to do something to feel safe, usually avoiding the thing. That brings relief right away, but it also means you never find out the danger wasn't real, so the alarm goes off again next time.",
  "The chapter names four things that keep false alarms going: <b>avoiding</b> things that aren't really dangerous, <b>worrying</b> over and over about what might happen, <b>misreading</b> how dangerous something is, and <b>feeling you can't cope</b> with distress. The Coping Inventory below measures all four.",
  "<b>What to do:</b> tick any anxiety types below that fit you and list the specific situations you fear under each. Then rate the 20 Coping Inventory statements."],steps:[
  ["w1a","Read the summary above","How fear and the fight-or-flight response work"],
  ["w1b","List the situations you fear","Use the worksheet below"],
  ["w1c","Take the Coping Inventory","Rate all 20 statements below from 1 to 5"],
  ["w1d","Check your four scores","Any score of 15+ adds a chapter. The page adds them up for you"]]},
 {id:"w2",nav:"Week 2",when:"Week 2",title:"Ch. 3 · Assessment",page:"p. 21",ws:wk2,sum:[
  "This week you build a detailed list of everything you fear. It becomes the base for the rest of the program, so take your time.",
  "<b>Safety behaviors</b> are things you do to protect yourself from fear. Common ones: avoiding, asking others for reassurance, distracting yourself, putting things off, checking and double-checking, over-preparing, perfectionism, rituals or lucky objects, making lists so you don't forget, and using alcohol or drugs to take the edge off. They help in the moment, but they stop you from learning that you can handle the situation, so the fear sticks around.",
  "Avoidance comes in three kinds: avoiding <b>situations</b> (places, people, things), avoiding <b>thoughts</b> (pushing worries or memories away), and avoiding <b>body sensations</b> (anything that makes your heart race or makes you feel hot or out of breath).",
  "<b>What to do:</b> move your fears from Week 1 into the list below. Rate each one 0–100 for how distressing it feels, then write what you do to feel safe. Tick the kinds of avoidance you use. Finally, split any big fear into smaller pieces. For example, \"crowds\" might become restaurants, movie theaters, concerts and checkout lines."],steps:[
  ["w2a","Copy your fears into the Exposure Inventory",""],
  ["w2b","Rate each fear 0–100","How distressing it feels"],
  ["w2c","Write your safety behaviors next to each fear","Avoiding, reassurance, distraction, over-preparing, checking…"],
  ["w2d","Tick the kinds of avoidance you use","Situations, thoughts, or body sensations"],
  ["w2e","Break big fears into smaller items",""]]},
 {id:"w3",nav:"Week 3",when:"Week 3",title:"Ch. 4 · Motivation",page:"p. 31",ws:wk3,sum:[
  "Facing fears is hard, so you need strong reasons. This chapter builds them three ways.",
  "<b>What avoidance costs you.</b> The more you avoid, the smaller your life gets. Friends and family get frustrated, work suffers, fun disappears, and you can slide into feeling down. And you never learn there's less to fear than you think.",
  "<b>What you care about.</b> Think about what you'd do if anxiety weren't in the way. When fear blocks the things that matter to you, life starts to feel empty. That's one way anxiety and depression feed each other.",
  "<b>Willingness.</b> Avoidance comes from not being willing to feel fear. Getting better means saying yes to all of it: the racing heart, the knot in your stomach, the scary thoughts, for as long as an exposure lasts.",
  "<b>What to do:</b> fill in what avoidance costs you in each area of life, list what each fear stops you from doing, then answer the willingness question."],steps:[
  ["w3a","Fill in what avoidance costs you","9 areas of life, rated 1–5"],
  ["w3b","List what each fear blocks you from doing","Rated 1–5 for how much it matters"],
  ["w3c","Answer the willingness question",""]]},
 {id:"w4",nav:"Weeks 4–5",when:"Weeks 4–5",title:"Ch. 5 · Preparation",page:"p. 39",ws:wk4,sum:[
  "Now you turn your fear list into a plan. For each fear you add four things: <b>a plan</b> to drop the safety behavior and face the fear, <b>how much it matters</b> to you (1–5), <b>the worst thing you predict</b> will happen, and <b>how likely that feels</b> (%).",
  "There are two kinds of plan. <b>All at once:</b> stop the safety behavior right away and do the thing you've been avoiding. <b>Gradual:</b> 2 to 5 steps that take you from full safety behavior down to none. Gradual is gentler but takes longer.",
  "Ways to cut a safety behavior gradually: prepare a little less each time; wait longer before asking for reassurance; shorten or change distractions; set a deadline instead of putting things off; do part of the thing first, then all of it; check less and less often; make small mistakes on purpose; shorten rituals; keep lists shorter and time-limited; cut back on alcohol or drugs.",
  "<b>Predictions have to be things you could see happen</b>, not feelings. Not \"I'll be anxious\" (you will be), but \"I'll have to leave after five minutes\" or \"the cashier will roll their eyes and walk away.\"",
  "<b>The % is how likely it feels</b>, not the real odds. If it feels 80% likely, write 80.",
  "Tricks for building good items: combine two milder fears into one scarier one, split a big fear into smaller steps, change how close you get or how long you stay, or imagine a scary scene first."],steps:[
  ["w4a","Choose all-at-once or gradual for each fear",""],
  ["w4b","Write your plan for each fear",""],
  ["w4c","Rate how much each one matters (1–5)",""],
  ["w4d","Predict the worst outcome for each",""],
  ["w4e","Rate how likely each one feels (%)",""],
  ["w4f","Keep adding fears until every one has a full plan",""]]},
 {id:"w6",nav:"Week 6+",when:"Week 6 on",title:"Ch. 6 · The Anxiety Solution",page:"p. 79",ws:wk6,sum:[
  "The whole method in two lines: <b>stop doing what you usually do to feel safe, and do what you usually avoid.</b> You can't argue yourself out of a fear. Only real experience changes it, by showing you that what you predicted doesn't happen.",
  "<b>Fine-tune your list first.</b> Every item should feel at least 60% likely to go badly. If one is lower, stay longer, get closer, or combine it with another fear. Cover the range from 60% up to 100% with no gaps bigger than 10 points. Pick things you actually want to do, that matter to you, that avoidance has cost you, and that most people consider safe. You can also add imagined scenes or exercises that bring on body sensations.",
  "<b>Doing exposures:</b>",
  "<ul><li>Start with the item that has the lowest distress score.</li><li>After that, mix it up. Jump to harder items instead of climbing a strict ladder, asking \"What do I need to learn next?\" If mixing is too much, go back to easiest-to-hardest.</li><li>For the harder ones, pick things that matter a lot to you.</li><li>Change where, how and with whom you do them.</li><li>Notice everything you feel and think. Don't reassure yourself, use coping thoughts, or distract yourself. Do nothing to feel safer.</li><li>Stay the full time you planned, or until your sense of how likely the bad outcome is has dropped a lot.</li><li>Once you've had some wins, combine two exposures.</li></ul>",
  "After each exposure, fill in a <b>Results Tracker</b> entry below. You're done when you can do the things you used to avoid. Some anxiety may remain, and that's normal."],steps:[
  ["w6a","Fine-tune your list","The page flags anything below 60% or with big gaps"],
  ["w6b","Do your first exposure (lowest distress) and log it",""],
  ["w6c","Keep going, mixing easier and harder items",""],
  ["w6d","Stop when you can do the things you used to avoid",""]]}];

 {id:"c7",nav:"Ch. 7",when:"Add-on",title:"Ch. 7 · You Can Face Fear",page:"p. 101",col:"mis",ws:ch7,sum:[
  "This chapter is about trusting that you can cope. When you think you can't handle anything, even small threats feel overwhelming.",

 {id:"c8",nav:"Ch. 8",when:"Add-on",title:"Ch. 8 · Reducing Worry with Defusion",page:"p. 115",col:"wor",ws:ch8,sum:[
  "Worry makes anxiety worse because your body reacts to imagined disasters as if they were real. By the time you face the actual situation, you've already lived through it ten times in your head. The <b>worry experiment</b> below lets you see this for yourself: rate your anxiety, deliberately worry about a feared situation for a few minutes, then rate it again.",
  "<b>Defusion</b> means stepping back and watching your thoughts instead of being swept along by them: having a thought, not being the thought. You practice with short exercises (below), then use it day to day: \"There's that thought again,\" or \"Thanks, mind,\" then let it go.",
  "For a thought that keeps coming back, ask four questions: How old is it? What is it trying to do for me? Has it actually worked? Can I take it with me and still do what matters?",
  "<b>Don't use defusion right before or during an exposure.</b>"],steps:[
  ["c8v","Try the worry experiment","See how worrying raises your anxiety"],
  ["c8a","Try each of the five exercises",""],
  ["c8b","Work through the four questions for a sticky thought",""],
  ["c8c","Use it day to day when worry starts",""]]},
 {id:"c9",nav:"Ch. 9",when:"Add-on",title:"Ch. 9 · Correcting Your Anxiety Lens",page:"p. 127",col:"mis",ws:ch9,sum:[
  "Anxiety works like a lens that makes danger look bigger. It does that in three ways: <b>negative predictions</b> (\"this is going to go badly\"), <b>negative focus</b> (only noticing what's wrong), and <b>problem magnification</b> (making a problem seem enormous). Your Cognitive Distortions sheet, at the top of this page, is a more detailed list of the same habits.",
  "First practice telling the three apart, then keep a thought log for a week to see which one you use most. Then work on that one:",
  "<ul><li><b>Predictions:</b> work out how often a worry has actually come true; log predictions and check them later; ask what the prediction is for and whether it helps.</li><li><b>Focus:</b> for every negative, find two positives (comfort, calm, getting something done, learning, connection, feeling appreciated, meaning, helping someone); look for the other side of hard experiences; ask what your negative focus is trying to do for you (let off tension, lower expectations, avoid disappointment or future stress, improve yourself) and whether it's actually working.</li><li><b>Magnification:</b> place your problem on a ladder of bigger and smaller problems; describe it the way a calm friend would; ask how long you'll remember it.</li></ul>",
  "<b>Don't use these right before or during an exposure.</b> Use them for everyday worry."],steps:[
  ["c9a","Practice sorting the three patterns",""],
  ["c9b","Keep a thought log for a week",""],
  ["c9c","Do the exercises for your most common pattern",""]]},
 {id:"c10",nav:"Ch. 10",when:"Add-on",title:"Ch. 10 · Distress Tolerance Skills",page:"p. 145",col:"dis",ws:ch10,sum:[
  "Distress tolerance is being able to feel stress without being overwhelmed. It's a skill you can build, like any other.",
  "Five ways to build it: <b>mindfulness</b> (noticing the present moment without judging it), <b>relaxation</b> (slow belly breathing and a calming cue word), <b>self-soothing</b> (pleasant things for each of your senses, not alcohol or drugs), <b>positive distraction</b> (planned, meaningful things to do, unlike panicked escape), and <b>coping thoughts</b> (checking the real odds and preparing calm statements).",
  "<b>Don't use these during an exposure.</b> Use them for stressful situations you can't or shouldn't avoid."],steps:[
  ["c10a","Practice mindfulness and relaxation",""],
  ["c10b","Pick your self-soothing and distraction options",""],
  ["c10c","Fill in a probability worksheet",""],
  ["c10d","Write your coping statements",""]]},
 {id:"pan",nav:"Panic extras",when:"If panic is one of your types",title:"Appendix IV · Body-Sensation Exercises",page:"p. 211",ws:panic,sum:[
  "If you have panic, the thing you fear most is often the feeling of panic itself: a racing heart, dizziness, breathlessness. These exercises bring those feelings on safely, on purpose, until they stop being scary.",
  "<b>Check with your doctor first</b>, especially before running, holding your breath or fast breathing. If it feels like too much to do alone, have someone with you at first.",
  "<b>Stage 1:</b> try each of the ten exercises once and rate your anxiety (0–100) and how much it feels like panic (0–100%). <b>Stage 2:</b> anything 40% or more like panic goes on your practice list, easiest first. The page builds it for you. <b>Stage 3:</b> start with the easiest. Keep going at least 30 seconds after the uncomfortable feelings start, rate your anxiety, then breathe slowly and remind yourself the sensation is harmless. Repeat until your anxiety is 25 or lower, then move on. After that, try real-life activities you've avoided."],steps:[
  ["pa","Try each exercise once and rate it",""],
  ["pb","Practice your list until each one is 25 or lower",""],
  ["pc","Move on to real-life activities",""]]}];

const KN={id:"kn",nav:"Book 2",when:"Book 2 · Introduction",title:"The Cognitive Behavioral Workbook for Anxiety (Knaus)",page:"p. 1",ws:knIntro,sum:[
  "Your second book covers the same ground from a different angle, and adds chapters on problems the main plan doesn't cover directly: procrastination, depression, worry, perfectionism, shyness, self-worth, social anxiety and panic.",
  "Knaus calls needless fears <b>parasitic</b>: they feed on you and give nothing back. His approach has three parts that run through every chapter: <b>educate your reason</b> (question the fearful thinking), <b>build emotional tolerance</b> (be willing to feel discomfort without running from it) and <b>act</b> (face the fear in manageable steps until it fades).",
  "<b>How to use it:</b> Part 1 (chapters 1–6) builds the basic toolkit. Part 2 (chapters 7–9) adds the main thinking, tolerance and exposure methods. Chapters 10–18 each tackle one specific problem, so do the ones that fit you. Chapters marked <b>Recommended</b> match your Week 1 answers. You can do this book alongside the main plan or after it.",
  "Every chapter ends with the same short form: write down the key ideas you'll use, your action plan, and what happened when you tried it. It's at the bottom of each chapter below."],steps:[
  ["k0","Read the summary above",""]]};
const KCH=[
 {id:"k1",n:1,part:"Part 1",title:"Welcome to the World of Parasitic Anxieties and Fears",page:"p. 9",ws:k1,sum:[
  "Normal fear is an alarm for real danger, and it's on your side. <b>Parasitic</b> anxieties and fears are intense, lasting fears of things that aren't really dangerous: a mistake in front of a group, germs, rejection, the feeling of fear itself.",
  "<b>Fear and anxiety differ in distance and time.</b> Fear is about a danger that's right here, now. Anxiety is about something that might happen later. Because anxiety gives you time, you can use that time to prepare: separate what's <i>possible</i> from what's <i>probable</i>, consider likelier explanations, remind yourself the fear is a passing thought, and accept yourself as much more than your fears.",
  "<b>Building tolerance</b> means accepting that discomfort is unpleasant but won't harm you, and that it passes. Even a 10% gain in tolerance makes a real difference.",
  "<b>Acting</b> means facing the fear in bite-sized steps, and finishing each step you start: backing away halfway teaches your brain that escape is the answer.",
  "<b>What to do:</b> pick one fear and fill in the matrix: what you'll think, how you'll tolerate the feeling, and what you'll do, ahead of time, as anxiety turns into fear, and in the moment itself."],steps:[
  ["k1a","Read the summary",""],["k1b","Fill in your matrix plan for one fear",""],["k1c","Fill in your key ideas and action plan",""]]},
 {id:"k2",n:2,part:"Part 1",title:"Developing Your Self-Observant Skills",page:"p. 22",ws:k2,sum:[
  "When you're <b>self-absorbed</b>, you stew in your fears or distract yourself from them. When you're <b>self-observant</b>, you watch your thoughts, feelings and actions as if from the outside, so you can see the links and try something different.",
  "Bring three strengths to bear on a fear: <b>intellect</b> (facts that counter it), <b>ingenuity</b> (creative angles, like humor, or picturing the fear as a squeaky mouse with a megaphone) and <b>will</b> (persisting, and remembering hard changes you've already made).",
  "<b>Keep a journal:</b> for each anxious moment, write the situation, the threatening thought, how you felt and what you did. Then add other possible explanations. A registered letter could be a tax audit, or a neighbor's building permit, or an inheritance.",
  "<b>Catastrophic thinking</b> blows things out of proportion. Ask: what am I telling myself? Would a neutral observer agree? How else could I see it? For sweeping claims like \"everyone hates me\": define \"everyone,\" give an example, then find an exception. \"What if\" thoughts are really predictions in disguise, so check the actual odds. Or keep asking \"and then what?\" until you reach the realistic bottom line, and go straight there.",
  "Finally, treat situations as <b>challenges</b> rather than threats, and list the strengths you've used to meet past challenges."],steps:[
  ["k2a","Read the summary",""],["k2b","Do your intellect, ingenuity and will plan",""],["k2c","Keep the journal for at least a week",""],["k2d","Check the odds on three \"what if\" thoughts",""],["k2e","List your capabilities",""]]},
 {id:"k3",n:3,part:"Part 1",title:"Overcoming Double Troubles",page:"p. 34",ws:k3,sum:[
  "A <b>double trouble</b> is getting upset about being upset: fearing fear, panicking about panic, \"I can't stand feeling this way,\" or calling yourself weak for being anxious. The second layer is often worse than the original fear.",
  "Double troubles are built from five ingredients: <b>magnifying</b> the problem, <b>overgeneralizing</b> (\"always,\" \"never,\" \"forever\"), <b>urgency</b> (\"I must stop feeling this now\"), <b>helplessness</b>, and <b>circular thinking</b> (\"I can't change, so it'll last forever; it lasts forever, so I can't change\").",
  "To break them: start the thought with \"I assume\" or \"I believe\" so it becomes something you can test. Define the key words (what exactly do \"can't,\" \"change\" and \"forever\" mean?). Then look for exceptions that prove it wrong.",
  "Practice three kinds of acceptance: of yourself (you're far more than your fears), of others, and of life as it is. And drop the idea of failure: treat each attempt as an experiment that shows you what works, what doesn't, and what's in between."],steps:[
  ["k3a","Read the summary",""],["k3b","Test your main double-trouble thought",""],["k3c","Answer the six questions",""]]},
 {id:"k4",n:4,part:"Part 1",title:"Self-Management Techniques to Defeat Fear",page:"p. 44",ws:k4,sum:[
  "A seven-part plan for change: <b>analyze</b> the fear, set a <b>mission</b>, set <b>goals</b>, break them into <b>objectives</b>, make an <b>action plan</b>, <b>carry it out</b>, and <b>review and revise</b>.",
  "Start with the fear inventory below, and retake it monthly as an early warning sign. Then break your main fear into four parts: what sets it off, what you tell yourself, what comes with it (like perfectionism or low mood), and how it shows up in your body. Get a medical checkup if you haven't, to rule out physical causes.",
  "Good goals are relevant, measurable and achievable. Watch for a <b>hidden goal</b>: if avoiding discomfort matters more to you than beating the fear, avoidance will win. Make tolerating discomfort part of the goal.",
  "Expect barriers: sitting on the fence, resisting change as a loss of freedom, perfectionism, putting it off, waiting to feel ready, and telling yourself you can't. When you carry out the plan, stay with the fear until it fades. You'll know it's working when you think more clearly, feel better and act differently."],steps:[
  ["k4a","Take the fear inventory",""],["k4b","Break down your main fear",""],["k4c","Write your mission, goals and objectives",""],["k4d","Write and carry out your step-by-step plan",""],["k4e","Review and revise",""]]},
 {id:"k5",n:5,part:"Part 1",title:"A Multimodal Attack Against Anxieties and Fear",page:"p. 60",ws:k5,sum:[
  "<b>BASIC-ID</b> is a checklist of seven areas where a fear lives: <b>B</b>ehavior, <b>A</b>ffect (emotions), <b>S</b>ensations, <b>I</b>magery, <b>C</b>ognition (beliefs), <b>I</b>nterpersonal (relationships) and <b>D</b>rugs/biology (sleep, exercise, caffeine, alcohol, medication). Covering all seven makes change faster and helps stop fears from returning.",
  "Some anxiety is a real warning. In the book's example, a woman's rising anxiety turned out to be signaling an unhealthy relationship. Clearing away the needless fears lets you hear the real ones.",
  "A useful trick is to <b>spot the contradiction</b>: compare the fear story (\"no one else will ever want me\") with your actual history.",
  "One caution: relaxing, massage and similar comforts are fine, but if they're all you do, they become a way of putting off the real work. Follow them with thinking and action steps."],steps:[
  ["k5a","Read the summary",""],["k5b","Fill in your BASIC-ID for one fear and rank the areas",""],["k5c","Try the fixes, starting with your top area",""]]},
 {id:"k6",n:6,part:"Part 1",title:"Five Steps for Positive Change",page:"p. 70",ws:k6,sum:[
  "Changing means facing uncertainty, and not being able to stand uncertainty fuels worry. The answer isn't to wait for a guarantee, but to face uncertainty with a plan.",
  "Five phases of change: <b>Awareness</b> (understand your fear: the seven questions below), <b>Action</b> (treat steps as experiments that test your fearful predictions), <b>Accommodation</b> (reconcile the clash between \"I can't change\" and the evidence that you have; compare the benefits of keeping the fear with challenging it), <b>Acceptance</b> (see things as they are, change what you can, adjust to what you can't) and <b>Actualization</b> (stretch toward something positive you actually want).",
  "Accepting uncertainty means: accepting the facts, accepting you can learn to handle it, accepting you'll feel it in the moment, accepting that preparing can be uncomfortable, and accepting that over-preparing just feeds the idea that perfection will keep you safe."],steps:[
  ["k6a","Answer the seven awareness questions",""],["k6b","Do the benefits analysis",""],["k6c","Write and start your actualization plan",""]]},
 {id:"k7",n:7,part:"Part 2",title:"Developing the Mind to Stop Anxiety",page:"p. 83",ws:k7,sum:[
  "Two tools for stepping back from fearful thinking.",
  "<b>ABCDE:</b> the <b>A</b>dversity, your <b>B</b>eliefs about it (a reasonable one and a fear-driven one), the <b>C</b>onsequences of each (feelings and actions), <b>D</b>isputing the fear-driven belief with six questions (Does it fit the facts? Does it help my goals? My relationships? Does it counter fearful thinking? Is it reasonable here? Is it helpful or harmful?), and the new <b>E</b>ffect. Then give yourself a <b>behavioral assignment</b> to test it: for example, share an opinion with ten people and see how differently they react.",
  "<b>PURRRRS</b> slows down automatic fearful reactions: <b>P</b>ause, <b>U</b>se your resources (write it down), <b>R</b>eflect, <b>R</b>eason it out, <b>R</b>espond with action, <b>R</b>evise, and <b>S</b>tabilize by repeating it."],steps:[
  ["k7a","Do an ABCDE on one fear",""],["k7b","Carry out a behavioral assignment",""],["k7c","Work through a PURRRRS plan",""]]},
 {id:"k8",n:8,part:"Part 2",title:"Building Emotional Tolerance",page:"p. 95",ws:k8,sum:[
  "If you're <b>sensitive to body sensations</b>, small changes like a faster heartbeat can set off <b>triggering thoughts</b> (\"here it comes again\") and then <b>amplifying thoughts</b> (\"I'm losing control\"). Three countermeasures: <b>Occam's razor</b> (the simplest explanation is usually right: you climbed stairs), <b>realistic labels</b> (\"exercise reaction\") and <b>milder words</b> (\"unpleasant\" instead of \"awful\").",
  "Your emotions accurately reflect what you're thinking, but the thinking can be off. A five-step approach: name what set it off, spot the triggering and amplifying thoughts, take a coping view, plan coping actions, and choose ways to tolerate the feeling (and reward yourself afterward).",
  "<b>Self-doubt and sensitivity to sensations</b> feed each other. Reluctance to start is best met by starting promptly, every time, until it becomes a habit.",
  "<b>Low frustration tolerance</b> shows up as \"I can't cope\" (distress), \"I need relief now\" (urgency) and \"I can't take any more\" (intolerance). Notice these thoughts and let them pass like clouds, swap in milder words, and use PURRRRS."],steps:[
  ["k8a","Fill in the sensation countermeasure",""],["k8b","Use the five steps on a real situation",""],["k8c","Reword your low-frustration thoughts",""]]},
 {id:"k9",n:9,part:"Part 2",title:"Behavioral Methods to Quell Fear",page:"p. 111",ws:k9,sum:[
  "The brain's alarm learns fears fast and unlearns them slowly. Talking yourself out of a fear isn't enough. It takes <b>corrective experience</b>: facing the fear and finding out nothing bad happens.",
  "<b>Graduated exposure:</b> break the fear into small steps, start with the easiest, and stay until the tension drops before moving on. In the book's example, a woman afraid of the dark used a dimmer switch to lower the light a notch at a time, and within three weeks she could sleep in the dark. Pace yourself, one or two steps per session with a couple of days between. After a setback, drop back a step and try again.",
  "<b>Card sort:</b> write each version of the feared situation on a card (where, how close, how many people) and sort them from least to most scary. That's your ladder.",
  "<b>Relaxation:</b> tense, hold and release each muscle group (5 seconds each), then breathe slowly thinking \"calm.\" Belly breathing helps too.",
  "<b>Note:</b> this book allows relaxation alongside exposure. The main plan asks you <b>not</b> to use calming tools during exposures, so the fear can be fully disproven. For main-plan exposures, follow the main plan's rule."],steps:[
  ["k9a","Make your card-sort ladder",""],["k9b","Work up the ladder, logging each step",""],["k9c","Practice the relaxation exercises",""]]},
 {id:"k10",n:10,part:"Specific problems",title:"Breaking the Procrastination-Fear Connection",page:"p. 127",ws:k10,sum:[
  "Procrastination and fear have the same root: dodging discomfort. Putting off facing a fear brings relief, and that relief trains you to keep putting it off.",
  "You divert yourself in three ways: <b>behavioral</b> (doing something else instead, or hopping from one fear to the next without finishing any), <b>mental</b> (\"tomorrow,\" or \"once I've lost weight / done more research\") and <b>emotional</b> (waiting until you feel ready or inspired).",
  "Tools: spot each diversion and plan an alternative; question your scary self-talk with \"because\" (\"I'll look like a fool <i>because</i>…\"); weigh the short- and long-term costs of avoiding versus facing; use the thing you'd normally escape into as a <b>reward</b> after you take a step.",

 {id:"k11",n:11,part:"Specific problems",title:"Overcoming Mixed Anxiety and Depression",page:"p. 144",ws:k11,sum:[
  "Anxiety and depression often come together, and depression usually weighs more. Depression shows up in the body (sleep, appetite, energy, focus) and in thinking: a negative view of yourself, your experiences and your future.",
  "The thought they share is <b>powerlessness</b>: \"I can't do anything about this.\" But being in a situation you can't control isn't the same as being powerless. There's a difference between \"can't\" and \"won't because I think I can't.\" Blaming others or yourself feeds powerlessness, while choosing to accept what you can't change is itself a form of control.",

 {id:"k12",n:12,part:"Specific problems",title:"Defusing Worry",page:"p. 152",ws:k12,sum:[
  "Worry is thinking about bad things that probably won't happen. It's more about words than body sensations, but it can build into full anxiety.",
  "Keep a <b>worry log</b> with a rebuttal for each worry, and watch for six traps: treating the <b>possible</b> as <b>probable</b>; <b>\"could be\"</b> logic; the <b>frequency</b> trap (remembering the rare times it happened); <b>\"if, then\"</b> leaps (\"if he hasn't called in five minutes, he's crashed\"); the <b>relief</b> trap (feeling relieved when nothing happens rewards the worry); and the <b>theory</b> trap (it sounds reasonable, so it must be true).",
  "Other tools: exaggerate the worry until it's funny; take it to a ridiculous worst case; label it as rumination; ask \"Do I feel like continuing?\"; turn worry into concern by asking what responsible action you can take; imagine you're the one who's late; and set a daily ten-minute worry time."],steps:[

 {id:"k13",n:13,part:"Specific problems",title:"Stopping Perfectionist Thinking",page:"p. 165",ws:k13,sum:[
  "Striving for excellence is healthy. <b>Perfectionism</b> is different: it ties your worth to impossible standards and breeds anxiety, procrastination and low mood.",
  "Four common rules to question: \"I have to win,\" \"I have to be in control,\" \"I have to feel comfortable\" and \"Everyone has to approve of me.\" Look for the contradictions in each.",

  "Swap <b>requiring</b> words (must, should, have to) for <b>aspiring</b> words (want, prefer, would like), and think in likelihoods rather than demands. Then make small mistakes on purpose, like dressing down or getting a minor detail wrong, and notice what actually happens."],steps:[

 {id:"k14",n:14,part:"Specific problems",title:"Defeating Inhibition",page:"p. 176",ws:k14,sum:[

 {id:"k15",n:15,part:"Specific problems",title:"Addressing Self-Worth Fears",page:"p. 186",ws:k15,sum:[

 {id:"k16",n:16,part:"Specific problems",title:"Addressing Social-Evaluation Anxieties",page:"p. 196",ws:k16,sum:[

 {id:"k17",n:17,part:"Specific problems",title:"Vanquishing Panic",page:"p. 210",ws:k17,sum:[

function likert(p,items,opts,start=1,wide=false){
  return `<ol class="qs">${items.map((q,i)=>{const k=p+"."+(start+i);return `<li class="q${wide?" wide":""}"><label for="${pid(k)}"><span class="qn">${start+i}</span><span class="qt">${esc(q)}</span></label>${field(k,{t:"sel",o:opts,bare:1})}</li>`}).join("")}</ol>`;

function sumOf(o,n){let t=0,c=0;for(let i=1;i<=n;i++){const v=o&&o[i];if(v!==undefined&&v!==""){t+=+v;c++}}return {t,c}}
function anxScore(){const s=sumOf(S.chk.anx,7);return {c:s.c,done:s.c===7,score:s.t*2}}
function aaqScore(){const s=sumOf(S.chk.aaq,7);return {c:s.c,done:s.c===7,score:s.t}}
const band=v=>ANX_BANDS.find(([m])=>v<=m)[1];
function hist(type){
  const h=((S.chk&&S.chk.hist)||[]).filter(e=>e.type===type);
  if(!h.length)return `<p class="empty">No saved check-ins yet.</p>`;
  const first=h[0];
  const head=type==="ci"?`<th>Date</th>${CI_COLS.map(c=>`<th>${c[1]}</th>`).join("")}<th></th>`:`<th>Date</th><th>Score</th><th>${type==="anx"?"Level":"Change from first"}</th><th></th>`;
  const row=e=>type==="ci"?`<td>${esc(e.date)}</td>${CI_COLS.map(c=>`<td>${e[c[0]]}</td>`).join("")}`
    :`<td>${esc(e.date)}</td><td>${e.score} / ${type==="anx"?42:49}</td><td>${type==="anx"?band(e.score):(e===first?"–":(e.score-first.score>0?"+":"")+(e.score-first.score))}</td>`;
  return `<div class="scroll"><table class="ci"><thead><tr>${head}</tr></thead><tbody>${h.map(e=>`<tr class="ih">${row(e)}<td><button class="del" style="position:static" data-del="chk.hist|${e.id}" aria-label="Remove this check-in">×</button></td></tr>`).join("")}</tbody></table></div>`;
}

/* ---------- computed bits ---------- */
function scores(){const out={};let complete=true;CI_COLS.forEach((c,k)=>{let t=0;for(let i=1;i<=5;i++){const v=+S.ci[i+"."+(k+1)]||0;if(!v)complete=false;t+=v}out[c[0]]=t});out.complete=complete;out.any=Object.keys(S.ci).some(k=>S.ci[k]);return out}
function isRec(p){const sc=scores();if(p.col)return sc.complete&&sc[p.col]>=15;if(p.id==="pan"||p.id==="k17")return !!S.types.pan;if(p.id==="k16")return !!S.types.soc;if(p.id==="k12")return !!S.types.gad||(sc.complete&&sc.wor>=15);return false}
function fineTune(){
  const rows=S.inv.filter(r=>r.fear);
  if(!rows.length)return `<p class="empty">Add fears with a "how likely" % in Weeks 4–5 and this will check your list.</p>`;
  const msgs=[];const noP=rows.filter(r=>r.prob===""||r.prob==null);
  if(noP.length)msgs.push(`${noP.length} fear${noP.length>1?"s don't":" doesn't"} have a % yet.`);
  const low=rows.filter(r=>r.prob!==""&&r.prob!=null&&+r.prob<60);
  low.forEach(r=>msgs.push(`<b>${esc(r.fear)}</b> is at ${r.prob}%. Make it harder (stay longer, get closer, or combine it with another fear) until it's 60% or more.`));
  const ps=rows.map(r=>r.prob).filter(v=>v!==""&&v!=null&&+v>=60).map(Number).sort((a,b)=>a-b);
  for(let i=1;i<ps.length;i++)if(ps[i]-ps[i-1]>10)msgs.push(`There's a gap between ${ps[i-1]}% and ${ps[i]}%. Add something in between.`);
  if(ps.length&&ps[0]>70)msgs.push(`Your easiest item is at ${ps[0]}%. Consider adding one around 60%.`);
  if(ps.length&&ps[ps.length-1]<90)msgs.push(`Your hardest item is at ${ps[ps.length-1]}%. Add a harder one that gets closer to 100%.`);
  const noW=rows.filter(r=>!r.worst);if(noW.length)msgs.push(`${noW.length} fear${noW.length>1?"s need":" needs"} a predicted worst outcome.`);
  const first=rows.filter(r=>r.suds!==""&&r.suds!=null).sort((a,b)=>a.suds-b.suds)[0];
  return (msgs.length?`<div class="callout">${msgs.map(m=>`<div>${m}</div>`).join("")}</div>`:`<div class="callout ok">Your list looks ready: everything is 60% or more with no big gaps.</div>`)
   +(first?`<p class="note">Your first exposure: <b>${esc(first.fear)}</b> (lowest distress, ${first.suds}).</p>`:"")
   +`<p class="note">Also check that each item is something you want to do, that matters to you, and that most people consider safe.</p>`;
}
function renderIH(){
  const el=document.getElementById("ih");if(!el)return;
  const x=(S.x&&S.x.intero)||{};
  const list=INTERO.filter(([id])=>x[id]&&+x[id].sim>=40).sort((a,b)=>(+x[a[0]].anx||0)-(+x[b[0]].anx||0));
  if(!list.length){el.innerHTML=`<p class="empty">Rate the exercises above. Anything 40% or more like panic will show up here.</p>`;return}
  el.innerHTML=`<div class="scroll"><table class="ih"><thead><tr><th>Exercise</th>${[1,2,3,4,5,6,7,8].map(t=>`<th>Try ${t}</th>`).join("")}</tr></thead><tbody>${list.map(([id,l])=>`<tr><td>${esc(l)}</td>${[1,2,3,4,5,6,7,8].map(t=>{const p="x.ih."+id+".t"+t;return `<td>${field(p,{t:"num",bare:1})}</td>`}).join("")}</tr>`).join("")}</tbody></table></div>`;
}
function refresh(){
  const total=MAIN.reduce((n,p)=>n+p.steps.length,0), done=MAIN.reduce((n,p)=>n+p.steps.filter(s=>S.done[s[0]]).length,0);
  const ar=document.getElementById("anx-res");if(ar){const s=anxScore();ar.innerHTML=!s.c?"":s.done?`Score <b>${s.score} of 42</b>: ${band(s.score)}`:`${s.c} of 7 answered`}
  const qr=document.getElementById("aaq-res");if(qr){const s=aaqScore();qr.innerHTML=!s.c?"":s.done?`Score <b>${s.score} of 49</b>. Higher means more avoidance.`:`${s.c} of 7 answered`}
  const wv=document.getElementById("wv");if(wv){const b=+S.f.wv_b,a=+S.f.wv_a;wv.innerHTML=b&&a?(a>b?`Worrying raised your anxiety from <b>${b}</b> to <b>${a}</b>. That's how worry keeps fear high.`:`Before ${b}, after ${a}.`):""}
  const x=S.x||{};
  const cnt=(o,test)=>Object.values(o||{}).filter(test).length;
  const k4=document.getElementById("k4-res");if(k4){const n=cnt(x.k4inv,v=>v==="4");k4.innerHTML=x.k4inv&&Object.keys(x.k4inv).length?`<b>${n}</b> item${n===1?"":"s"} rated 4 (just like me).`:""}
  const k12=document.getElementById("k12-res");if(k12){const n=cnt(x.k12inv,v=>v==="True");k12.innerHTML=x.k12inv&&Object.keys(x.k12inv).length?`<b>${n} of ${K12_INV.length}</b> true. The more you ticked, the more worry is worth working on.`:""}
  const k16=document.getElementById("k16-res");if(k16){const n=cnt(x.k16inv,v=>+v>=4);k16.innerHTML=x.k16inv&&Object.keys(x.k16inv).length?`<b>${n}</b> item${n===1?"":"s"} rated 4 or 5. Those are your areas to work on.`:""}
  const b=document.getElementById("bar");if(b)b.style.width=(total?Math.round(done/total*100):0)+"%";
  const c=document.getElementById("count");if(c)c.innerHTML=done+'<span style="font-size:.5em;color:#BBD0E8"> / '+total+'</span><small>steps done</small>';
  const sc=scores();
  CI_COLS.forEach(([k])=>{const el=document.getElementById("tot-"+k);if(el)el.textContent=sc.any?sc[k]+" / 25":"–"});
  const r=document.getElementById("ci-result");
  if(r)r.innerHTML=!sc.any?"":!sc.complete?`<span class="chip">Answer all 20 to see your add-on chapters</span>`:CI_COLS.map(([k,n,ch])=>sc[k]>=15?`<span class="chip hot">${n} ${sc[k]}: ${k==="av"?"Weeks 2–6 are built for this":"add "+ch}</span>`:`<span class="chip">${n} ${sc[k]}: under 15</span>`).join("");
  const ft=document.getElementById("ft");if(ft)ft.innerHTML=fineTune();
  const vq=document.getElementById("vq");
  if(vq){const m=+S.f.vq_made,t=+S.f.vq_true;vq.innerHTML=m>0&&S.f.vq_true!==""&&S.f.vq_true!=null?`It came true <b>${t} of ${m}</b> times: <b>${Math.round(t/m*1000)/10}%</b>. ${t/m<.2?"That worry is wrong far more often than it's right.":""}`:""}
  SORT_Q.forEach(([,ans],i)=>{const el=document.getElementById("qf-"+i);if(!el)return;const v=S.q[i];if(!v){el.textContent="";el.className="fb";return}const ok=v===PATTERNS[ans];el.textContent=ok?"Right":"It's "+PATTERNS[ans].split(" ")[1];el.className="fb "+(ok?"ok":"no")});
}
function setStatus(t){statusText=t;const el=document.getElementById("status");if(el)el.textContent=t}

/* ---------- page ---------- */
function section(p){
  const rec=isRec(p);
  const items=p.steps.map(([id,t,sub])=>`<li class="${S.done[id]?"is-done":""}"><label><input type="checkbox" id="${pid("done."+id)}" data-b="done.${id}" data-rr ${S.done[id]?"checked":""}><span class="txt"><span>${esc(t)}</span>${sub?`<small>${esc(sub)}</small>`:""}</span></label></li>`).join("");
  const fin=p.steps.every(s=>S.done[s[0]]);
  return `<section class="phase" id="${p.id}"><div class="phase-head"><span class="when">${esc(p.when)}</span><h2>${esc(p.title)}${rec?'<span class="tag rec">Recommended</span>':""}${fin?'<span class="tag">Done</span>':""}</h2>${p.page?`<span class="page">${p.page}</span>`:""}</div>
  <details class="sum" data-k="${p.id}" ${OPEN[p.id]===false?"":"open"}><summary>What this chapter says</summary>${p.sum.map(x=>x.startsWith("<ul")?x:`<p>${x}</p>`).join("")}</details>
  <ul class="steps">${items}</ul>${p.ws()}${p.kp?keyplan(p.id):""}</section>`;
}
function render(){
  const a=document.activeElement, aid=a&&a.id, sel=a&&a.selectionStart!=null&&a.type!=="number"?[a.selectionStart,a.selectionEnd]:null;
  root.innerHTML=`  <nav class="jump" aria-label="Jump to">${["traps",...MAIN.map(p=>p.id),"kn"].map(id=>{const p=ALL.find(q=>q.id===id);return `<a href="#${id}" class="${p&&isRec(p)?"rec":""}">${id==="traps"?"Thinking traps":esc(p.nav)}</a>`}).join("")}</nav>
  <section class="phase" id="traps"><div class="phase-head"><span class="when">Keep handy</span><h2>Thinking traps</h2></div>
  <p class="note">From your Cognitive Distortions sheet. These habits make situations look more dangerous than they are. Watch for them in every week, and use them in your thought log in chapter 9.</p>
  <details class="sum" data-k="traps" ${OPEN.traps?"open":""}><summary>Show all 11</summary><div class="traps" style="margin-top:12px">${TRAPS.map(([n,d,e])=>`<div class="trap"><b>${esc(n)}</b>${esc(d)}<i>${esc(e)}</i></div>`).join("")}</div></details></section>
  ${PLAN.map(section).join("")}
  <div class="addon-intro"><h3>Add-on chapters</h3><p class="note">Do the ones your Coping Inventory marks <b>Recommended</b> alongside Weeks 3–6. The panic exercises are recommended if you ticked Panic in Week 1.</p></div>
  ${ADDONS.map(section).join("")}
  ${section(FINISH)}
  <div class="addon-intro"><h3>Book 2</h3><p class="note"><i>The Cognitive Behavioral Workbook for Anxiety</i>, all 18 chapters. Do it alongside the main plan or after it. Book 2 steps aren't counted in the progress bar at the top.</p></div>
  ${section(KN)}${KCH.map(section).join("")}
  <footer>Your answers save to your Supabase database and to this browser. Summaries, statements and questionnaires are written in our own words, based on <i>The CBT Anxiety Solution Workbook</i> (McKay, Skeen &amp; Fanning), your Cognitive Distortions sheet, and <i>The Cognitive Behavioral Workbook for Anxiety</i> (Knaus). Not a substitute for a therapist.</footer>`;
  renderIH();refresh();
  if(aid){const el=document.getElementById(aid);if(el){el.focus({preventScroll:true});if(sel&&el.setSelectionRange)try{el.setSelectionRange(sel[0],sel[1])}catch(e){}}}
}

/* ---------- events ---------- */
function clampNum(t){if(t.value==="")return "";let v=+t.value;if(isNaN(v))return "";const mn=+t.dataset.min,mx=+t.dataset.max;return Math.max(mn,Math.min(mx,v))}
function sync(t){document.querySelectorAll(`[data-b="${t.dataset.b}"]`).forEach(el=>{if(el!==t&&el.value!==t.value)el.value=t.value})}
root.addEventListener("input",e=>{
  const t=e.target;if(!t.dataset||!t.dataset.b||t.type==="checkbox"||t.tagName==="SELECT")return;
  setPath(t.dataset.b,t.dataset.num!==undefined?clampNum(t):t.value);sync(t);save();
  if(t.dataset.live!==undefined)refresh();
});
root.addEventListener("change",e=>{
  const t=e.target,d=t.dataset||{};
  if(d.ci){if(t.value)S.ci[d.ci]=+t.value;else delete S.ci[d.ci];save();render();return}
  if(!d.b)return;
  if(t.type==="checkbox"){setPath(d.b,t.checked?true:undefined);save();if(d.rr!==undefined)render();else refresh();return}
  if(t.tagName==="SELECT"){setPath(d.b,t.value===""?undefined:t.value);sync(t);save();refresh();return}
  if(d.ih!==undefined)renderIH();
});
root.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.dataset.snap){
    const ty=t.dataset.snap;let e2;
    if(ty==="ci"){const sc=scores();if(!sc.complete){setStatus("Answer all 20 Coping Inventory statements in Week 1 first.");return}e2={av:sc.av,wor:sc.wor,mis:sc.mis,dis:sc.dis}}
    else{const s=ty==="anx"?anxScore():aaqScore();if(!s.done){setStatus("Answer all 7 statements first.");return}e2={score:s.score};S.chk[ty]={}}
    arr("chk.hist").push(Object.assign({id:uid(),type:ty,date:new Date().toLocaleDateString()},e2));save();render();return}
  if(t.dataset.add){const id=uid();arr(t.dataset.add).push({id});save();render();const f=root.querySelector(`[data-b^="${t.dataset.add}.${id}."]`);if(f)f.focus();return}
  if(t.dataset.del){const [p,id]=t.dataset.del.split("|");const a=arr(p),i=a.findIndex(r=>r.id===id);if(i>=0){a.splice(i,1);save();render()}}
});

root.addEventListener("toggle",e=>{const d=e.target;if(d.tagName==="DETAILS"&&d.dataset.k)OPEN[d.dataset.k]=d.open},true);

    else if(local){await flush()}
    else setStatus('Ready');
  }catch(e){online=false;setStatus('Saved in this browser only. Couldn\'t reach the database.')}
})();
})();
