<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trent's Resource Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #F8F6F1;
    --ink: #1C1C1A;
    --muted: #79776F;
    --accent: #1F6FEB;
    --rule: #E2DED6;
    --card: #FFFFFF;
    --danger: #DC2626;
  }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--ink); min-height: 100vh; -webkit-font-smoothing: antialiased; }
  header { background: var(--card); border-bottom: 1px solid var(--rule); padding: 1.25rem 2rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; }
  .header-left h1 { font-size: 1rem; font-weight: 500; }
  .header-left p { font-size: 0.78rem; color: var(--muted); margin-top: 0.1rem; }
  .btn-add { padding: 0.6rem 1.25rem; background: var(--accent); color: white; font-size: 0.83rem; font-weight: 500; border: none; cursor: pointer; font-family: inherit; }
  .main { max-width: 800px; margin: 0 auto; padding: 2rem 1.5rem; }
  .tabs { display: flex; border: 1px solid var(--rule); margin-bottom: 1.25rem; background: var(--rule); gap: 1px; }
  .tab { flex: 1; padding: 0.65rem 0.5rem; font-size: 0.8rem; font-weight: 500; font-family: inherit; border: none; background: var(--card); color: var(--muted); cursor: pointer; text-align: center; }
  .tab.active { background: var(--accent); color: white; }
  .search-bar { width: 100%; padding: 0.75rem 1rem; font-size: 0.93rem; font-family: inherit; border: 1px solid var(--rule); background: var(--card); color: var(--ink); outline: none; margin-bottom: 1rem; }
  .search-bar::placeholder { color: var(--muted); }
  .count { font-size: 0.78rem; color: var(--muted); margin-bottom: 0.75rem; }
  .links-list { display: flex; flex-direction: column; gap: 1px; background: var(--rule); border: 1px solid var(--rule); }
  .link-item { background: var(--card); padding: 1rem 1.25rem; display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
  .link-info { flex: 1; min-width: 0; }
  .link-title { font-size: 0.93rem; font-weight: 500; margin-bottom: 0.15rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .link-url { font-size: 0.78rem; color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-decoration: none; display: block; }
  .link-cat { font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; margin-top: 0.2rem; }
  .link-actions { display: flex; gap: 0.4rem; flex-shrink: 0; }
  .btn-open { padding: 0.4rem 0.9rem; background: var(--accent); color: white; font-size: 0.78rem; font-weight: 500; border: none; cursor: pointer; font-family: inherit; text-decoration: none; display: inline-block; }
  .btn-edit { padding: 0.4rem 0.7rem; background: none; color: var(--muted); font-size: 0.78rem; border: 1px solid var(--rule); cursor: pointer; font-family: inherit; }
  .btn-edit:hover { border-color: var(--accent); color: var(--accent); }
  .btn-delete { padding: 0.4rem 0.7rem; background: none; color: var(--muted); font-size: 0.78rem; border: 1px solid var(--rule); cursor: pointer; font-family: inherit; }
  .btn-delete:hover { color: var(--danger); border-color: var(--danger); }
  .empty { text-align: center; padding: 4rem 2rem; color: var(--muted); background: var(--card); border: 1px solid var(--rule); }
  .empty strong { display: block; font-size: 1rem; color: var(--ink); margin-bottom: 0.4rem; }
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 100; align-items: center; justify-content: center; padding: 1rem; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--card); width: 100%; max-width: 460px; padding: 2rem; border: 1px solid var(--rule); }
  .modal h2 { font-size: 1rem; font-weight: 500; margin-bottom: 1.5rem; }
  .field { margin-bottom: 1rem; }
  .field label { display: block; font-size: 0.78rem; font-weight: 500; text-transform: uppercase; color: var(--muted); margin-bottom: 0.4rem; }
  .field input, .field select { width: 100%; padding: 0.65rem 0.85rem; font-size: 0.9rem; font-family: inherit; border: 1px solid var(--rule); background: var(--bg); color: var(--ink); outline: none; }
  .modal-actions { display: flex; gap: 0.75rem; margin-top: 1.5rem; }
  .btn-save { flex: 1; padding: 0.65rem; background: var(--accent); color: white; font-size: 0.88rem; font-weight: 500; border: none; cursor: pointer; font-family: inherit; }
  .btn-cancel { padding: 0.65rem 1.25rem; background: none; color: var(--muted); font-size: 0.88rem; border: 1px solid var(--rule); cursor: pointer; font-family: inherit; }
  .toast { position: fixed; bottom: 1.5rem; right: 1.5rem; background: var(--ink); color: white; padding: 0.65rem 1.25rem; font-size: 0.83rem; opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 200; }
  .toast.show { opacity: 1; }
  .loading { text-align: center; padding: 3rem; color: var(--muted); }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>Resource Library</h1>
    <p>Your personal references & links</p>
  </div>
  <button class="btn-add" onclick="openModal(null)">+ Add Link</button>
</header>

<div class="main">
  <div class="tabs">
    <button class="tab active" id="tab-All" onclick="setTab('All')">All</button>
    <button class="tab" id="tab-Salesforce" onclick="setTab('Salesforce Knowledge')">Salesforce</button>
    <button class="tab" id="tab-Work" onclick="setTab('Work Stuff')">Work Stuff</button>
    <button class="tab" id="tab-Personal" onclick="setTab('Personal Websites')">Personal Sites</button>
    <button class="tab" id="tab-Auto" onclick="setTab('Automotive Knowledge')">Automotive</button>
  </div>
  <input type="text" class="search-bar" id="searchInput" placeholder="Search by title or URL..." oninput="applyFilters()">
  <div class="count" id="count"></div>
  <div id="linksList"><div class="loading">Loading...</div></div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle">Add a Resource</h2>
    <input type="hidden" id="editId" value="">
    <div class="field">
      <label>Title</label>
      <input type="text" id="titleInput" placeholder="e.g. Salesforce Flow best practices" />
    </div>
    <div class="field">
      <label>URL</label>
      <input type="text" id="urlInput" placeholder="https://..." />
    </div>
    <div class="field">
      <label>Category</label>
      <select id="categoryInput">
        <option value="Salesforce Knowledge">Salesforce Knowledge</option>
        <option value="Work Stuff">Work Stuff</option>
        <option value="Personal Websites">Personal Websites</option>
        <option value="Automotive Knowledge">Automotive Knowledge</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn-save" onclick="saveLink()">Save</button>
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  var SB_URL = 'https://fnpgduicigxxlvpduugb.supabase.co';
  var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZucGdkdWljaWd4eGx2cGR1dWdiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxMTQyMTgsImV4cCI6MjA5MzY5MDIxOH0.PBZYiC6Ljrot6zIz460yPawPK-AlV59AEcFNIjHwfNc';
  var H = { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' };

  var allLinks = [];
  var activeTab = 'All';
  var linkMap = {};

  function fetchLinks() {
    fetch(SB_URL + '/rest/v1/links?order=created_at.desc', { headers: H })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        allLinks = data;
        linkMap = {};
        for (var i = 0; i < data.length; i++) {
          linkMap[data[i].id] = data[i];
        }
        applyFilters();
      });
  }

  function setTab(tab) {
    activeTab = tab;
    document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
    var map = { 'All': 'tab-All', 'Salesforce Knowledge': 'tab-Salesforce', 'Work Stuff': 'tab-Work', 'Personal Websites': 'tab-Personal', 'Automotive Knowledge': 'tab-Auto' };
    document.getElementById(map[tab]).classList.add('active');
    document.getElementById('searchInput').value = '';
    applyFilters();
  }

  function applyFilters() {
    var q = document.getElementById('searchInput').value.toLowerCase();
    var filtered = allLinks.slice();
    if (activeTab !== 'All') {
      filtered = filtered.filter(function(l) { return l.category === activeTab; });
    }
    if (q) {
      filtered = filtered.filter(function(l) {
        return (l.title||'').toLowerCase().indexOf(q) > -1 || (l.url||'').toLowerCase().indexOf(q) > -1;
      });
    }
    renderLinks(filtered);
  }

  function renderLinks(links) {
    document.getElementById('count').textContent = links.length + ' resource' + (links.length !== 1 ? 's' : '');
    if (!links.length) {
      document.getElementById('linksList').innerHTML = '<div class="empty"><strong>Nothing here yet</strong>Hit "+ Add Link" to save your first one.</div>';
      return;
    }
    var html = '<div class="links-list">';
    for (var i = 0; i < links.length; i++) {
      var l = links[i];
      html += '<div class="link-item">' +
        '<div class="link-info">' +
          '<div class="link-title">' + esc(l.title) + '</div>' +
          '<a class="link-url" href="' + esc(l.url) + '" target="_blank">' + esc(l.url) + '</a>' +
          '<div class="link-cat">' + esc(l.category || '') + '</div>' +
        '</div>' +
        '<div class="link-actions">' +
          '<a class="btn-open" href="' + esc(l.url) + '" target="_blank">Open ↗</a>' +
          '<button class="btn-edit" data-id="' + esc(l.id) + '">Edit</button>' +
          '<button class="btn-delete" data-id="' + esc(l.id) + '">✕</button>' +
        '</div>' +
      '</div>';
    }
    html += '</div>';
    document.getElementById('linksList').innerHTML = html;

    document.querySelectorAll('.btn-edit').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var id = this.getAttribute('data-id');
        openModal(linkMap[id]);
      });
    });

    document.querySelectorAll('.btn-delete').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var id = this.getAttribute('data-id');
        deleteLink(id);
      });
    });
  }

  function openModal(link) {
    document.getElementById('editId').value = link ? link.id : '';
    document.getElementById('modalTitle').textContent = link ? 'Edit Resource' : 'Add a Resource';
    document.getElementById('titleInput').value = link ? link.title : '';
    document.getElementById('urlInput').value = link ? link.url : '';
    document.getElementById('categoryInput').value = link ? (link.category || 'Salesforce Knowledge') : 'Salesforce Knowledge';
    document.getElementById('modalOverlay').classList.add('open');
    setTimeout(function() { document.getElementById('titleInput').focus(); }, 100);
  }

  function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }

  function saveLink() {
    var title = document.getElementById('titleInput').value.trim();
    var url = document.getElementById('urlInput').value.trim();
    var category = document.getElementById('categoryInput').value;
    var editId = document.getElementById('editId').value;
    if (!title || !url) { showToast('Fill in both fields'); return; }
    var fullUrl = url.indexOf('http') === 0 ? url : 'https://' + url;

    var method = editId ? 'PATCH' : 'POST';
    var endpoint = editId ? SB_URL + '/rest/v1/links?id=eq.' + editId : SB_URL + '/rest/v1/links';
    var hdrs = Object.assign({}, H, { 'Prefer': 'return=minimal' });

    fetch(endpoint, {
      method: method,
      headers: hdrs,
      body: JSON.stringify({ title: title, url: fullUrl, category: category })
    }).then(function(res) {
      if (res.ok) { closeModal(); showToast(editId ? 'Updated!' : 'Saved!'); fetchLinks(); }
      else { showToast('Error saving'); }
    });
  }

  function deleteLink(id) {
    if (!confirm('Delete this?')) return;
    fetch(SB_URL + '/rest/v1/links?id=eq.' + id, { method: 'DELETE', headers: H })
      .then(function() { showToast('Deleted'); fetchLinks(); });
  }

  document.getElementById('modalOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeModal();
  });

  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function() { t.classList.remove('show'); }, 2500);
  }

  function esc(str) {
    return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  fetchLinks();
</script>
</body>
</html>
