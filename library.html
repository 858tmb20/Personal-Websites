<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trent's Resource Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #F8F6F1;
    --ink: #1C1C1A;
    --muted: #79776F;
    --accent: #1F6FEB;
    --rule: #E2DED6;
    --card: #FFFFFF;
    --danger: #DC2626;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  header {
    background: var(--card);
    border-bottom: 1px solid var(--rule);
    padding: 1.25rem 2rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .header-left h1 {
    font-size: 1rem;
    font-weight: 500;
    letter-spacing: 0.01em;
  }
  .header-left p {
    font-size: 0.78rem;
    color: var(--muted);
    margin-top: 0.1rem;
  }

  .btn-add {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.6rem 1.25rem;
    background: var(--accent);
    color: white;
    font-size: 0.83rem;
    font-weight: 500;
    border: none;
    cursor: pointer;
    transition: opacity 0.2s;
    font-family: inherit;
  }
  .btn-add:hover { opacity: 0.88; }

  .main {
    max-width: 760px;
    margin: 0 auto;
    padding: 2rem 1.5rem;
  }

  .search-bar {
    width: 100%;
    padding: 0.75rem 1rem;
    font-size: 0.93rem;
    font-family: inherit;
    border: 1px solid var(--rule);
    background: var(--card);
    color: var(--ink);
    outline: none;
    margin-bottom: 1.5rem;
    transition: border-color 0.2s;
  }
  .search-bar:focus { border-color: var(--accent); }
  .search-bar::placeholder { color: var(--muted); }

  .count {
    font-size: 0.78rem;
    color: var(--muted);
    margin-bottom: 0.75rem;
    letter-spacing: 0.03em;
  }

  .links-list {
    display: flex;
    flex-direction: column;
    gap: 1px;
    background: var(--rule);
    border: 1px solid var(--rule);
  }

  .link-item {
    background: var(--card);
    padding: 1rem 1.25rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    transition: background 0.15s;
  }
  .link-item:hover { background: #F8F6F1; }

  .link-info { flex: 1; min-width: 0; }
  .link-title {
    font-size: 0.93rem;
    font-weight: 500;
    margin-bottom: 0.2rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .link-url {
    font-size: 0.78rem;
    color: var(--accent);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-decoration: none;
  }
  .link-url:hover { text-decoration: underline; }

  .link-actions { display: flex; gap: 0.5rem; flex-shrink: 0; }
  .btn-open {
    padding: 0.4rem 0.9rem;
    background: var(--accent);
    color: white;
    font-size: 0.78rem;
    font-weight: 500;
    border: none;
    cursor: pointer;
    font-family: inherit;
    text-decoration: none;
    display: inline-block;
    transition: opacity 0.2s;
  }
  .btn-open:hover { opacity: 0.85; }
  .btn-delete {
    padding: 0.4rem 0.7rem;
    background: none;
    color: var(--muted);
    font-size: 0.78rem;
    border: 1px solid var(--rule);
    cursor: pointer;
    font-family: inherit;
    transition: color 0.2s, border-color 0.2s;
  }
  .btn-delete:hover { color: var(--danger); border-color: var(--danger); }

  .empty {
    text-align: center;
    padding: 4rem 2rem;
    color: var(--muted);
    font-size: 0.9rem;
    background: var(--card);
    border: 1px solid var(--rule);
  }
  .empty strong { display: block; font-size: 1rem; color: var(--ink); margin-bottom: 0.4rem; }

  /* MODAL */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--card);
    width: 100%;
    max-width: 460px;
    padding: 2rem;
    border: 1px solid var(--rule);
  }
  .modal h2 { font-size: 1rem; font-weight: 500; margin-bottom: 1.5rem; }
  .field { margin-bottom: 1rem; }
  .field label { display: block; font-size: 0.78rem; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.4rem; }
  .field input {
    width: 100%;
    padding: 0.65rem 0.85rem;
    font-size: 0.9rem;
    font-family: inherit;
    border: 1px solid var(--rule);
    background: var(--bg);
    color: var(--ink);
    outline: none;
    transition: border-color 0.2s;
  }
  .field input:focus { border-color: var(--accent); }
  .modal-actions { display: flex; gap: 0.75rem; margin-top: 1.5rem; }
  .btn-save {
    flex: 1;
    padding: 0.65rem;
    background: var(--accent);
    color: white;
    font-size: 0.88rem;
    font-weight: 500;
    border: none;
    cursor: pointer;
    font-family: inherit;
    transition: opacity 0.2s;
  }
  .btn-save:hover { opacity: 0.88; }
  .btn-cancel {
    padding: 0.65rem 1.25rem;
    background: none;
    color: var(--muted);
    font-size: 0.88rem;
    border: 1px solid var(--rule);
    cursor: pointer;
    font-family: inherit;
    transition: border-color 0.2s;
  }
  .btn-cancel:hover { border-color: var(--ink); color: var(--ink); }

  .toast {
    position: fixed;
    bottom: 1.5rem;
    right: 1.5rem;
    background: var(--ink);
    color: white;
    padding: 0.65rem 1.25rem;
    font-size: 0.83rem;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.2s, transform 0.2s;
    pointer-events: none;
    z-index: 200;
  }
  .toast.show { opacity: 1; transform: translateY(0); }

  .loading { text-align: center; padding: 3rem; color: var(--muted); font-size: 0.9rem; }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>Resource Library</h1>
    <p>Your personal Salesforce & tech references</p>
  </div>
  <button class="btn-add" onclick="openModal()">+ Add Link</button>
</header>

<div class="main">
  <input type="text" class="search-bar" placeholder="Search by title or URL..." oninput="filterLinks(this.value)" id="searchInput">
  <div class="count" id="count"></div>
  <div id="linksList"><div class="loading">Loading your links...</div></div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="handleOverlayClick(event)">
  <div class="modal">
    <h2>Add a Resource</h2>
    <div class="field">
      <label>Title</label>
      <input type="text" id="titleInput" placeholder="e.g. How to use Flow Decision elements" />
    </div>
    <div class="field">
      <label>URL</label>
      <input type="text" id="urlInput" placeholder="https://..." />
    </div>
    <div class="modal-actions">
      <button class="btn-save" onclick="saveLink()">Save</button>
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const SUPABASE_URL = 'https://fnpgduicigxxlvpduugb.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZucGdkdWljaWd4eGx2cGR1dWdiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxMTQyMTgsImV4cCI6MjA5MzY5MDIxOH0.PBZYiC6Ljrot6zIz460yPawPK-AlV59AEcFNIjHwfNc';

  let allLinks = [];

  const headers = {
    'apikey': SUPABASE_KEY,
    'Authorization': `Bearer ${SUPABASE_KEY}`,
    'Content-Type': 'application/json'
  };

  async function fetchLinks() {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/links?order=created_at.desc`, { headers });
    allLinks = await res.json();
    renderLinks(allLinks);
  }

  function renderLinks(links) {
    const el = document.getElementById('linksList');
    const count = document.getElementById('count');
    count.textContent = `${links.length} resource${links.length !== 1 ? 's' : ''}`;
    if (!links.length) {
      el.innerHTML = `<div class="empty"><strong>No resources yet</strong>Hit "+ Add Link" to save your first one.</div>`;
      return;
    }
    el.innerHTML = `<div class="links-list">${links.map(l => `
      <div class="link-item">
        <div class="link-info">
          <div class="link-title">${escHtml(l.title)}</div>
          <a class="link-url" href="${escHtml(l.url)}" target="_blank">${escHtml(l.url)}</a>
        </div>
        <div class="link-actions">
          <a class="btn-open" href="${escHtml(l.url)}" target="_blank">Open ↗</a>
          <button class="btn-delete" onclick="deleteLink('${l.id}')">✕</button>
        </div>
      </div>`).join('')}</div>`;
  }

  function filterLinks(query) {
    const q = query.toLowerCase();
    const filtered = allLinks.filter(l =>
      l.title.toLowerCase().includes(q) || l.url.toLowerCase().includes(q)
    );
    renderLinks(filtered);
  }

  async function saveLink() {
    const title = document.getElementById('titleInput').value.trim();
    const url = document.getElementById('urlInput').value.trim();
    if (!title || !url) { showToast('Please fill in both fields'); return; }

    const fullUrl = url.startsWith('http') ? url : 'https://' + url;

    const res = await fetch(`${SUPABASE_URL}/rest/v1/links`, {
      method: 'POST',
      headers: { ...headers, 'Prefer': 'return=minimal' },
      body: JSON.stringify({ title, url: fullUrl })
    });

    if (res.ok) {
      closeModal();
      showToast('Resource saved!');
      fetchLinks();
    } else {
      showToast('Error saving — check console');
      console.error(await res.text());
    }
  }

  async function deleteLink(id) {
    if (!confirm('Delete this resource?')) return;
    await fetch(`${SUPABASE_URL}/rest/v1/links?id=eq.${id}`, {
      method: 'DELETE',
      headers
    });
    showToast('Deleted');
    fetchLinks();
  }

  function openModal() {
    document.getElementById('titleInput').value = '';
    document.getElementById('urlInput').value = '';
    document.getElementById('modalOverlay').classList.add('open');
    setTimeout(() => document.getElementById('titleInput').focus(), 100);
  }

  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('open');
  }

  function handleOverlayClick(e) {
    if (e.target === document.getElementById('modalOverlay')) closeModal();
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
    if (e.key === 'Enter' && document.getElementById('modalOverlay').classList.contains('open')) saveLink();
  });

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  fetchLinks();
</script>
</body>
</html>
