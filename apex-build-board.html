<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apex Build Board</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;700;800&family=Newsreader:wght@500;600&display=swap">
<style>
  :root {
    --midnight: #001731;
    --blue: #002855;
    --medium-blue: #0070F0;
    --sky-blue: #46B1EF;
    --lime: #97E152;
    --light-blue: #EEF6F9;
    --light-grey: #F1F1F1;
    --grey: #A7A7A7;
    --fg2: #264468;
    --white: #FFFFFF;
    --hairline: rgba(0, 40, 85, 0.12);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--white);
    color: var(--blue);
    font-family: 'Jost', 'Futura PT', 'Trebuchet MS', Arial, sans-serif;
    min-height: 100vh;
  }
  .apx-status-btn { transition: transform 120ms cubic-bezier(0.2,0,0.2,1), box-shadow 120ms; cursor: pointer; }
  .apx-status-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(0,23,49,0.10); }
  .apx-status-btn:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(0,112,240,0.35); }
  .apx-card { transition: box-shadow 220ms cubic-bezier(0.2,0,0.2,1); }
  .apx-card:hover { box-shadow: 0 4px 12px rgba(0,23,49,0.10); }
  @media (prefers-reduced-motion: reduce) { .apx-status-btn, .apx-card, .apx-bar { transition: none !important; } }

  header.apx-hdr {
    background: linear-gradient(180deg, var(--midnight) 0%, var(--blue) 100%);
    color: var(--white);
    padding: 40px 24px 32px;
  }
  .apx-hdr-inner { max-width: 860px; margin: 0 auto; }
  .apx-eyebrow {
    font-size: 13px; font-weight: 800; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--sky-blue); margin-bottom: 10px;
  }
  .apx-hdr-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
  .apx-hdr h1 {
    font-size: clamp(28px, 5vw, 44px); line-height: 1.05;
    font-weight: 800; margin: 0; letter-spacing: -0.01em;
  }
  .apx-count-wrap { text-align: right; }
  .apx-count {
    font-family: 'Newsreader', Georgia, serif; font-weight: 600;
    font-size: clamp(40px, 7vw, 64px); line-height: 1; color: var(--lime);
  }
  .apx-count .apx-of { font-size: 0.5em; color: #BBD0E8; }
  .apx-count-sub { font-size: 14px; color: #BBD0E8; margin-top: 4px; }
  .apx-track { margin-top: 24px; height: 10px; background: rgba(255,255,255,0.15); border-radius: 999px; overflow: hidden; }
  .apx-bar { height: 100%; width: 0%; background: var(--lime); border-radius: 999px; transition: width 420ms cubic-bezier(0.2,0.8,0.2,1); }

  .apx-filterbar {
    position: sticky; top: 0; z-index: 10;
    background: var(--white); border-bottom: 1px solid var(--hairline); padding: 12px 24px;
  }
  .apx-filter-inner { max-width: 860px; margin: 0 auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .apx-filter {
    border: none; border-radius: 999px; padding: 6px 16px;
    font-family: inherit; font-size: 14px; font-weight: 500;
    background: var(--light-grey); color: var(--fg2);
  }
  .apx-filter.on { background: var(--blue); color: var(--white); font-weight: 700; }
  .apx-filter-spacer { flex: 1; }
  .apx-save-note { font-size: 13px; color: var(--grey); }
  .apx-reset {
    border: 1px solid rgba(0,40,85,0.2); border-radius: 999px; padding: 5px 14px;
    font-family: inherit; font-size: 13px; font-weight: 500; background: var(--white); color: var(--fg2);
  }

  main { max-width: 860px; margin: 0 auto; padding: 32px 24px 80px; }
  section.apx-tier { margin-bottom: 48px; }
  .apx-tier-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 4px; }
  .apx-tier-num {
    font-family: 'Newsreader', Georgia, serif; font-weight: 600; font-size: 28px;
    color: var(--medium-blue); min-width: 40px;
  }
  .apx-tier-num.complete { color: var(--lime); }
  .apx-tier-head h2 { font-size: 24px; font-weight: 800; margin: 0; }
  .apx-tier-count { font-size: 14px; color: var(--grey); margin-left: auto; white-space: nowrap; }
  .apx-tier-goal { margin: 0 0 16px 52px; font-size: 15px; color: var(--fg2); }
  .apx-cards { display: flex; flex-direction: column; gap: 10px; }

  .apx-card {
    border: 1px solid var(--hairline);
    border-left: 4px solid var(--hairline);
    border-radius: 8px; padding: 14px 16px; background: var(--white);
    display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap;
  }
  .apx-card.in_progress { border-left-color: var(--medium-blue); }
  .apx-card.done { border-color: var(--lime); border-left: 4px solid var(--lime); background: var(--light-blue); }
  .apx-card-body { flex: 1 1 380px; min-width: 0; }
  .apx-title { font-size: 17px; font-weight: 700; }
  .apx-card.done .apx-title { text-decoration: line-through; text-decoration-color: var(--grey); text-decoration-thickness: 1.5px; }
  .apx-desc { font-size: 14.5px; line-height: 1.45; color: var(--fg2); margin-top: 4px; }
  .apx-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .apx-tag {
    font-size: 11.5px; font-weight: 500; letter-spacing: 0.03em;
    background: var(--light-grey); color: var(--fg2); border-radius: 4px; padding: 2px 8px;
  }
  .apx-pill {
    border: 1.5px solid rgba(0,40,85,0.15); border-radius: 999px; padding: 7px 16px;
    font-family: inherit; font-size: 13.5px; font-weight: 700;
    background: var(--light-grey); color: var(--fg2);
    white-space: nowrap; align-self: center;
  }
  .apx-pill.in_progress { background: #E4F0FE; color: var(--medium-blue); border-color: var(--medium-blue); }
  .apx-pill.done { background: var(--lime); color: var(--blue); border-color: var(--lime); }

  footer.apx-foot {
    border-top: 1px solid var(--hairline); padding-top: 20px;
    font-size: 14px; color: var(--grey);
    display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  }
  footer.apx-foot a { color: var(--fg2); }
</style>
</head>
<body>

<header class="apx-hdr">
  <div class="apx-hdr-inner">
    <div class="apx-eyebrow">Apex Training &middot; Admin to Developer</div>
    <div class="apx-hdr-row">
      <h1>Trent's Apex<br>Build Board</h1>
      <div class="apx-count-wrap">
        <div class="apx-count"><span id="doneCount">0</span><span class="apx-of">/<span id="totalCount">30</span></span></div>
        <div class="apx-count-sub" id="countSub">built &amp; working</div>
      </div>
    </div>
    <div class="apx-track"><div class="apx-bar" id="bar"></div></div>
  </div>
</header>

<div class="apx-filterbar">
  <div class="apx-filter-inner" id="filterBar">
    <span class="apx-filter-spacer"></span>
    <span class="apx-save-note" id="saveNote">Progress saves automatically</span>
    <button type="button" class="apx-reset apx-status-btn" id="resetBtn">Reset all</button>
  </div>
</div>

<main id="board"></main>

<script>
const STORAGE_KEY = "apex-tracker-v1";

const TIERS = [
  {
    name: "Trigger Fundamentals",
    goal: "Get comfortable with trigger contexts, bulkification, and addError.",
    items: [
      { id: "t1-1", title: "Welcome Task", desc: "After a Contact is inserted, create a follow-up Task for the Contact's owner, due 7 days out, subject 'Welcome call'. Must work when 200 Contacts are inserted at once.", tags: ["after insert", "Task DML", "bulkification"] },
      { id: "t1-2", title: "Copy Billing Address", desc: "Before insert/update on Contact: if mailing address is blank, copy the parent Account's billing address onto it. One SOQL query total, no queries in loops.", tags: ["before trigger", "SOQL map"] },
      { id: "t1-3", title: "No Deleting Closed Won", desc: "Before delete on Opportunity: block deletion of any Closed Won opp with a clear addError message. Non-admins should see it as a friendly validation, not an ugly exception.", tags: ["before delete", "addError"] },
      { id: "t1-4", title: "Data Janitor", desc: "Before insert/update on Lead: trim whitespace, title-case first/last name, and normalize Phone to (XXX) XXX-XXXX. Leave already-clean records untouched.", tags: ["string methods", "before trigger"] },
      { id: "t1-5", title: "Duplicate Email Guard", desc: "Before insert on Contact: block the insert if another Contact on the same Account already has that email. Handle the case where two dupes arrive in the same batch.", tags: ["sets", "addError", "edge cases"] },
      { id: "t1-6", title: "Stamp the Change", desc: "On Opportunity update: whenever StageName changes, append 'Old → New (timestamp, user)' to a long-text Stage_History__c field. Uses Trigger.oldMap.", tags: ["oldMap", "field compare"] }
    ]
  },
  {
    name: "SOQL, Collections & Patterns",
    goal: "Maps everywhere, aggregate queries, and the trigger handler pattern.",
    items: [
      { id: "t2-1", title: "Contact Counter", desc: "Keep Number_of_Contacts__c on Account accurate across insert, delete, undelete, AND reparenting of Contacts. Aggregate SOQL, one update per transaction.", tags: ["aggregate SOQL", "all contexts"] },
      { id: "t2-2", title: "Open Pipeline Rollup", desc: "Sum the Amount of all open Opportunities into Account.Open_Pipeline__c — no declarative rollup fields allowed. Recalculate on opp insert, update, delete.", tags: ["SUM()", "bulk update"] },
      { id: "t2-3", title: "One Primary Only", desc: "Primary_Contact__c checkbox on Contact: exactly one per Account. Checking a new one automatically unchecks the previous — without infinite trigger recursion.", tags: ["maps", "recursion guard"] },
      { id: "t2-4", title: "Owner Change Cascade", desc: "When an Account's owner changes, reassign all open Cases and open Tasks under it to the new owner. Compare old vs new OwnerId; skip untouched accounts.", tags: ["oldMap", "multi-object DML"] },
      { id: "t2-5", title: "Break It, Then Fix It", desc: "Deliberately write a trigger that updates its own object and recurses. Watch it fail, then fix it with a static variable inside a proper trigger handler class. Refactor one earlier scenario into the handler pattern too.", tags: ["static vars", "handler pattern"] }
    ]
  },
  {
    name: "Async Apex",
    goal: "Batch, Queueable, Schedulable, @future, and platform events.",
    items: [
      { id: "t3-1", title: "Stale Account Sweeper", desc: "Batch job: flag Accounts with no activity in 90 days (check LastActivityDate) by setting Stale__c = true. Use Database.Stateful to count them and email yourself a summary in finish().", tags: ["Batchable", "Stateful", "finish()"] },
      { id: "t3-2", title: "Contract Expiry Alerts", desc: "Schedulable that runs daily at 6am and kicks off a batch emailing owners of Contracts expiring within 30 days. Write the cron expression by hand before looking it up.", tags: ["Schedulable", "cron", "Messaging"] },
      { id: "t3-3", title: "Chained Recalc", desc: "Queueable that recalculates a Score__c field on a set of Accounts, then chains a second Queueable that writes a summary log record. Know the chaining depth limit.", tags: ["Queueable", "chaining"] },
      { id: "t3-4", title: "Future Fire-and-Forget", desc: "Implement an @future method that updates related records after a trigger runs. Then write down three concrete reasons Queueable beats @future, from experience not from a blog.", tags: ["@future", "async limits"] },
      { id: "t3-5", title: "Big Data Loader", desc: "Anonymous Apex script that generates 10,000 test Accounts with Contacts, then a batch job that finds and hard-deletes them. Your future test scenarios will thank you.", tags: ["bulk DML", "batch delete"] },
      { id: "t3-6", title: "Platform Event Publisher", desc: "Define a Case_Escalated__e platform event. Publish it from a Case trigger when IsEscalated flips to true; a subscriber trigger on the event updates a counter on the Account.", tags: ["EventBus", "event trigger"] }
    ]
  },
  {
    name: "Integrations",
    goal: "Callouts out, REST in, JSON everywhere.",
    items: [
      { id: "t4-1", title: "ZIP Code Enricher", desc: "Callout to api.zippopotam.us (free, no auth) to fill City and State on a Lead from its ZIP. Wrapper class for the JSON, invoked from a button or Queueable — never directly from a trigger.", tags: ["HttpRequest", "JSON wrapper"] },
      { id: "t4-2", title: "Daily Exchange Rates", desc: "Scheduled job that pulls USD exchange rates from a free API (frankfurter.app works) and upserts them into a Currency_Rate__c custom object. Batch class implements Database.AllowsCallouts.", tags: ["scheduled callout", "upsert"] },
      { id: "t4-3", title: "Named Credential Refactor", desc: "Take scenario above and move the endpoint behind a Named Credential + External Credential. No hardcoded URLs left anywhere.", tags: ["Named Credentials", "security"] },
      { id: "t4-4", title: "Inbound Lead API", desc: "@RestResource endpoint that accepts a JSON POST and creates a Lead. Return 201 with the new Id on success, 400 with a useful error body on bad input. Test it with curl or Postman against your dev org.", tags: ["Apex REST", "status codes"] },
      { id: "t4-5", title: "Nested JSON Parser", desc: "Call the GitHub public API for a repo (api.github.com/repos/...) and parse the deeply nested response into typed wrapper classes. Store 4-5 fields on a record. Practice null-safe navigation.", tags: ["wrappers", "deserialization"] },
      { id: "t4-6", title: "Retry & Error Log", desc: "Create a Callout_Log__c object. Wrap your callouts in try/catch, log every failure with request/response details, and build a retry batch that re-attempts failed logs up to 3 times.", tags: ["error handling", "retry pattern"] }
    ]
  },
  {
    name: "Testing & Polish",
    goal: "The part that actually gets you through code review.",
    items: [
      { id: "t5-1", title: "Test Data Factory", desc: "One reusable TestDataFactory class (makeAccounts, makeContacts, makeOpps...) — then refactor every test you've written so far to use it. No inline test data anywhere.", tags: ["@TestSetup", "factory pattern"] },
      { id: "t5-2", title: "Mock the Callout", desc: "HttpCalloutMock implementations for your integration scenarios — one success mock, one 500-error mock. Assert your error logging actually fires on failure.", tags: ["Test.setMock", "negative tests"] },
      { id: "t5-3", title: "Async Test Coverage", desc: "Use Test.startTest/stopTest to force your batch, queueable, and scheduled jobs to execute inside tests. Assert results, not just 'it ran'.", tags: ["startTest", "async testing"] },
      { id: "t5-4", title: "Bulk Proof", desc: "For your three favorite triggers: a test that pushes 251 records through and asserts SOQL/DML limits stay sane. Use Limits.getQueries() in your assertions.", tags: ["governor limits", "Limits class"] }
    ]
  },
  {
    name: "Capstones",
    goal: "Combine everything. These look a lot like real WGU work.",
    items: [
      { id: "t6-1", title: "Partner Intake Pipeline", desc: "Inbound REST endpoint receives a partner org as JSON and creates Account + Contact + Opportunity in one transaction — all or nothing, with Database.setSavepoint/rollback on any failure.", tags: ["Apex REST", "savepoints", "transactions"] },
      { id: "t6-2", title: "Nightly Data Quality Audit", desc: "Batch that scans Accounts for missing website/phone and near-duplicate names, writes findings to an Audit_Result__c object, and emails a digest. Basically your day job, automated.", tags: ["batch", "data quality", "email digest"] },
      { id: "t6-3", title: "Escalation Command Center", desc: "The full stack: escalated Case publishes a platform event → subscriber enqueues a Queueable → Queueable calls an external webhook (webhook.site is free) and logs the result. Mocked tests included.", tags: ["events", "queueable", "callout", "everything"] }
    ]
  }
];

const ALL_ITEMS = TIERS.flatMap(function(t) { return t.items; });

const STATUS = {
  not_started: { label: "Not started", next: "in_progress" },
  in_progress: { label: "In progress", next: "done" },
  done: { label: "Built & working", next: "not_started" }
};

const FILTERS = [
  { key: "all", label: "All" },
  { key: "not_started", label: "Not started" },
  { key: "in_progress", label: "In progress" },
  { key: "done", label: "Done" }
];

let statuses = {};
try {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (raw) {
    const parsed = JSON.parse(raw);
    if (parsed && parsed.statuses) statuses = parsed.statuses;
  }
} catch (e) { statuses = {}; }

let filter = "all";

function persist() {
  const note = document.getElementById("saveNote");
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ statuses: statuses }));
    note.textContent = "Progress saves automatically";
    note.style.color = "";
  } catch (e) {
    note.textContent = "Save failed — progress may not persist";
    note.style.color = "#B3261E";
  }
}

function stOf(id) { return statuses[id] || "not_started"; }

function cycle(id) {
  statuses[id] = STATUS[stOf(id)].next;
  persist();
  render();
}

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function renderFilters() {
  const bar = document.getElementById("filterBar");
  bar.querySelectorAll(".apx-filter").forEach(function(b) { b.remove(); });
  const spacer = bar.querySelector(".apx-filter-spacer");
  FILTERS.slice().reverse().forEach(function(f) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "apx-filter apx-status-btn" + (filter === f.key ? " on" : "");
    b.textContent = f.label;
    b.addEventListener("click", function() { filter = f.key; render(); });
    bar.insertBefore(b, bar.firstChild === spacer ? spacer : bar.firstChild);
  });
}

function render() {
  renderFilters();

  const doneCount = ALL_ITEMS.filter(function(i) { return stOf(i.id) === "done"; }).length;
  const ipCount = ALL_ITEMS.filter(function(i) { return stOf(i.id) === "in_progress"; }).length;
  document.getElementById("doneCount").textContent = doneCount;
  document.getElementById("totalCount").textContent = ALL_ITEMS.length;
  document.getElementById("countSub").innerHTML = "built &amp; working" + (ipCount > 0 ? " &middot; " + ipCount + " in progress" : "");
  document.getElementById("bar").style.width = Math.round(doneCount / ALL_ITEMS.length * 100) + "%";

  let html = "";
  TIERS.forEach(function(tier, ti) {
    const items = tier.items.filter(function(i) { return filter === "all" || stOf(i.id) === filter; });
    const tierDone = tier.items.filter(function(i) { return stOf(i.id) === "done"; }).length;
    if (items.length === 0 && filter !== "all") return;
    html += '<section class="apx-tier">'
      + '<div class="apx-tier-head">'
      + '<span class="apx-tier-num' + (tierDone === tier.items.length ? " complete" : "") + '">' + String(ti + 1).padStart(2, "0") + '</span>'
      + '<h2>' + esc(tier.name) + '</h2>'
      + '<span class="apx-tier-count">' + tierDone + '/' + tier.items.length + '</span>'
      + '</div>'
      + '<p class="apx-tier-goal">' + esc(tier.goal) + '</p>'
      + '<div class="apx-cards">';
    items.forEach(function(item) {
      const st = stOf(item.id);
      html += '<div class="apx-card ' + st + '">'
        + '<div class="apx-card-body">'
        + '<div class="apx-title">' + esc(item.title) + '</div>'
        + '<div class="apx-desc">' + esc(item.desc) + '</div>'
        + '<div class="apx-tags">' + item.tags.map(function(t) { return '<span class="apx-tag">' + esc(t) + '</span>'; }).join("") + '</div>'
        + '</div>'
        + '<button type="button" class="apx-pill apx-status-btn ' + st + '" data-cycle="' + esc(item.id) + '" title="Click to change status">' + STATUS[st].label + '</button>'
        + '</div>';
    });
    html += '</div></section>';
  });

  html += '<footer class="apx-foot">'
    + '<span>Click a status pill to cycle: Not started → In progress → Built &amp; working. Progress persists between sessions.</span>'
    + '<a href="library.html">&larr; Back to Library</a>'
    + '</footer>';

  document.getElementById("board").innerHTML = html;
  document.querySelectorAll("[data-cycle]").forEach(function(b) {
    b.addEventListener("click", function() { cycle(this.getAttribute("data-cycle")); });
  });
}

document.getElementById("resetBtn").addEventListener("click", function() {
  if (!window.confirm("Reset all progress? This clears every scenario back to Not started.")) return;
  statuses = {};
  persist();
  render();
});

render();
</script>
</body>
</html>
