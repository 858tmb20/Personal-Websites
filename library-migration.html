<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Library on Salesforce</title>
<script>try { if (!localStorage.getItem("lib_email")) location.replace("library.html"); } catch (e) {}</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;700;800&display=swap">
<style>
  :root { --midnight:#001731; --blue:#002855; --medium-blue:#0070F0; --sky-blue:#46B1EF; --fg2:#264468; --grey:#8A96A6; --paper:#F7F9FB; --hairline:rgba(0,40,85,0.14); }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--paper); color:var(--blue); font-family:'Jost','Trebuchet MS',Arial,sans-serif; min-height:100vh; display:flex; flex-direction:column; }
  header { background:linear-gradient(180deg,var(--midnight) 0%,var(--blue) 100%); color:#fff; padding:28px 24px 22px; }
  .inner { max-width:960px; margin:0 auto; width:100%; }
  .eyebrow { font-size:12px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--sky-blue); margin-bottom:6px; }
  .row { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  h1 { font-size:clamp(26px,4.5vw,38px); font-weight:800; margin:0; letter-spacing:-.01em; }
  .links { font-size:14px; } .links a { color:#BBD0E8; margin-left:14px; }
  main { flex:1; padding:20px 24px 32px; }
  .bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; font-size:13px; color:var(--grey); gap:12px; flex-wrap:wrap; }
  #status.err { color:#B3261E; }
  textarea { width:100%; min-height:72vh; resize:vertical; border:1px solid var(--hairline); border-radius:10px; background:#fff; color:var(--blue);
    padding:20px 22px; font-family:inherit; font-size:15.5px; line-height:1.65; outline:none; }
  textarea:focus { border-color:var(--medium-blue); box-shadow:0 0 0 3px rgba(0,112,240,.14); }
  textarea:disabled { opacity:.6; }
</style>
</head>
<body>
<header>
  <div class="inner row">
    <div><div class="eyebrow">Salesforce Learning &middot; Project</div><h1>Library on Salesforce</h1></div>
    <div class="links"><a href="library.html">&larr; Library</a></div>
  </div>
</header>
<main>
  <div class="inner">
    <div class="bar"><span>Project: move the resource library onto my Salesforce dev org, for practice.</span><span id="status">Loading&hellip;</span></div>
    <textarea id="sheet" disabled spellcheck="true" placeholder="Start typing your plan, notes, objects, to-dos&hellip;"></textarea>
  </div>
</main>
<script>
  var SB_URL = 'https://fnpgduicigxxlvpduugb.supabase.co';
  var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZucGdkdWljaWd4eGx2cGR1dWdiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxMTQyMTgsImV4cCI6MjA5MzY5MDIxOH0.PBZYiC6Ljrot6zIz460yPawPK-AlV59AEcFNIjHwfNc';
  var H = { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' };
  var ROW = SB_URL + '/rest/v1/scratchpad?id=eq.2';
  var ed = document.getElementById('sheet'), st = document.getElementById('status');
  var lastSaved = '', timer = null, saving = false;
  function status(t, err) { st.textContent = t; st.className = err ? 'err' : ''; }
  fetch(ROW + '&select=content', { headers: H }).then(function (r) { return r.json(); }).then(function (rows) {
    if (!Array.isArray(rows) || !rows.length) { status('Could not load the sheet', true); return; }
    ed.value = lastSaved = rows[0].content || '';
    ed.disabled = false; ed.focus(); status('All changes saved');
  }).catch(function () { status('Could not load the sheet', true); });
  function save() {
    var val = ed.value;
    if (val === lastSaved || saving) return;
    saving = true; status('Saving…');
    fetch(ROW, { method: 'PATCH', headers: Object.assign({}, H, { 'Prefer': 'return=representation' }), body: JSON.stringify({ content: val, updated_at: new Date().toISOString() }) })
      .then(function (r) { return r.json(); })
      .then(function (rows) { saving = false; if (!Array.isArray(rows) || !rows.length) { status('Not saved', true); return; } lastSaved = val; status('All changes saved'); if (ed.value !== lastSaved) save(); })
      .catch(function () { saving = false; status('Not saved — check your connection', true); });
  }
  ed.addEventListener('input', function () { status('Typing…'); clearTimeout(timer); timer = setTimeout(save, 1000); });
  ed.addEventListener('blur', save);
  window.addEventListener('beforeunload', function (e) { if (ed.value !== lastSaved) { save(); e.preventDefault(); e.returnValue = ''; } });
</script>
</body>
</html>
