<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Process Overview — Feature Request to Deployment</title>
  <style>
    :root { --bg:#F4F6F9; --ink:#0F1F3D; --muted:#6B7A99; --rule:#E3E7EE; --card:#FFFFFF; }
    * { box-sizing:border-box; }
    html,body { margin:0; background:var(--bg); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; color:var(--ink); }
    .wrap { max-width:640px; margin:0 auto; padding:2rem 1.25rem 3rem; }
    .card { background:var(--card); border:1px solid var(--rule); border-radius:16px; padding:1.25rem 1rem 1.25rem; box-shadow:0 1px 3px rgba(15,31,61,0.05); }
    svg { width:100%; height:auto; display:block; }
    .backlink { display:inline-flex; align-items:center; gap:0.4rem; margin-bottom:1rem; font-size:0.82rem; font-weight:700; color:var(--muted); text-decoration:none; }
    .backlink:hover { color:var(--ink); }
    .legend { display:flex; flex-wrap:wrap; justify-content:center; gap:0.4rem 1rem; margin-top:1rem; padding-top:1rem; border-top:1px solid var(--rule); }
    .lg { display:inline-flex; align-items:center; gap:0.4rem; font-size:0.72rem; font-weight:700; color:var(--muted); }
    .sw { width:12px; height:12px; border-radius:3px; border:1.5px solid; display:inline-block; flex-shrink:0; }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="backlink" href="#" onclick="if(window.opener){window.close();return false;}history.back();return false;">&#8592; Back to tracker</a>
    <div class="card">

int</text><line x1="260.0" y1="374" x2="260.0" y2="400" stroke="#94A0B8" stroke-width="2"/><path d="M255.0,397 L260.0,404 L265.0,397 Z" fill="#94A0B8"/><rect x="70.0" y="408" width="380" height="64" rx="12" fill="#E8F1FE" stroke="#BBD5FA" stroke-width="1.5"/><rect x="70.0" y="408" width="5" height="64" rx="2.5" fill="#1F6FEB"/><text x="260.0" y="435" text-anchor="middle" font-size="15" font-weight="800" fill="#1F6FEB">Build</text><text x="260.0" y="455" text-anchor="middle" font-size="12" fill="#6B7A99">do the sprint · develop the change</text><line x1="260.0" y1="472" x2="260.0" y2="498" stroke="#94A0B8" stroke-width="2"/><path d="M255.0,495 L260.0,502 L265.0,495 Z" fill="#94A0B8"/><rect x="70.0" y="506" width="380" height="64" rx="12" fill="#FCF1DF" stroke="#F2D9A8" stroke-width="1.5"/><rect x="70.0" y="506" width="5" height="64" rx="2.5" fill="#B4791E"/><text x="260.0" y="533" text-anchor="middle" font-size="15" font-weight="800" fill="#B4791E">Pull request</text><text x="260.0" y="553" text-anchor="middle" font-size="12" fill="#6B7A99">open PR → EdTech approval</text><line x1="260.0" y1="570" x2="260.0" y2="596" stroke="#94A0B8" stroke-width="2"/><path d="M255.0,593 L260.0,600 L265.0,593 Z" fill="#94A0B8"/><rect x="70.0" y="604" width="380" height="64" rx="12" fill="#E8F1FE" stroke="#BBD5FA" stroke-width="1.5"/><rect x="70.0" y="604" width="5" height="64" rx="2.5" fill="#1F6FEB"/><text x="260.0" y="631" text-anchor="middle" font-size="15" font-weight="800" fill="#1F6FEB">Test in Dev, then QA</text><text x="260.0" y="651" text-anchor="middle" font-size="12" fill="#6B7A99">after PR approval · dev first, then QA</text><line x1="260.0" y1="668" x2="260.0" y2="694" stroke="#94A0B8" stroke-width="2"/><path d="M255.0,691 L260.0,698 L265.0,691 Z" fill="#94A0B8"/><rect x="70.0" y="702" width="380" height="82" rx="12" fill="#FCF1DF" stroke="#F2D9A8" stroke-width="1.5"/><rect x="70.0" y="702" width="5" height="82" rx="2.5" fill="#B4791E"/><text x="260.0" y="728" text-anchor="middle" font-size="15" font-weight="800" fill="#B4791E">Change request + test plan</text><text x="260.0" y="748" text-anchor="middle" font-size="12" fill="#6B7A99">submit CR — link PR + Jira ticket</text><text x="260.0" y="765" text-anchor="middle" font-size="12" fill="#6B7A99">attach test plan → EdTech approval</text><line x1="260.0" y1="784" x2="260.0" y2="810" stroke="#94A0B8" stroke-width="2"/><path d="M255.0,807 L260.0,814 L265.0,807 Z" fill="#94A0B8"/><rect x="70.0" y="818" width="380" height="64" rx="12" fill="#E8F1FE" stroke="#BBD5FA" stroke-width="1.5"/><rect x="70.0" y="818" width="5" height="64" rx="2.5" fill="#1F6FEB"/><text x="260.0" y="845" text-anchor="middle" font-size="15" font-weight="800" fill="#1F6FEB">Deploy to Prod</text><text x="260.0" y="865" text-anchor="middle" font-size="12" fill="#6B7A99">release the change</text><line x1="260.0" y1="882" x2="260.0" y2="908" stroke="#94A0B8" stroke-width="2"/><path d="M255.0,905 L260.0,912 L265.0,905 Z" fill="#94A0B8"/><rect x="70.0" y="916" width="380" height="64" rx="12" fill="#E9F7EF" stroke="#B3E2C7" stroke-width="1.5"/><rect x="70.0" y="916" width="5" height="64" rx="2.5" fill="#15803D"/><text x="260.0" y="943" text-anchor="middle" font-size="15" font-weight="800" fill="#15803D">Communicate</text><text x="260.0" y="963" text-anchor="middle" font-size="12" fill="#6B7A99">April builds the communication plan</text><line x1="260.0" y1="980" x2="260.0" y2="1006" stroke="#94A0B8" stroke-width="2"/><path d="M255.0,1003 L260.0,1010 L265.0,1003 Z" fill="#94A0B8"/><rect x="70.0" y="1014" width="380" height="64" rx="12" fill="#E9F7EF" stroke="#B3E2C7" stroke-width="1.5"/><rect x="70.0" y="1014" width="5" height="64" rx="2.5" fill="#15803D"/><text x="260.0" y="1041" text-anchor="middle" font-size="15" font-weight="800" fill="#15803D">Train</text><text x="260.0" y="1061" text-anchor="middle" font-size="12" fill="#6B7A99">enable the users on the change</text></svg>
      <div class="legend"><span class="lg"><span class="sw" style="background:#F4F2ED;border-color:#E0DACE"></span>Intake</span><span class="lg"><span class="sw" style="background:#E8F1FE;border-color:#BBD5FA"></span>Build / test (you)</span><span class="lg"><span class="sw" style="background:#FCF1DF;border-color:#F2D9A8"></span>EdTech gate (PR / CR)</span><span class="lg"><span class="sw" style="background:#E9F7EF;border-color:#B3E2C7"></span>Rollout</span></div>
