<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deployment Tracker</title>
  <!-- Clean, standalone share URL. Embeds the tracker-only view of library.html so the
       address bar stays deployment-tracker.html (no redirect to the library URL).
       The personal library (plain library.html) remains locked behind its login gate. -->
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #EEF1F6; }
    iframe { border: 0; width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <iframe src="library.html?tracker" title="Deployment Tracker" allow="clipboard-write"></iframe>
</body>
</html>
